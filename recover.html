<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f7a5a">
  <title>Pokémon Sleep AI Manager 快取復原</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#20342d;background:#f4f7f5}
    body{margin:0;padding:32px 18px;min-height:100vh;display:grid;place-items:center}
    main{width:min(560px,100%);background:#fff;border:1px solid #dbe4df;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(24,79,60,.10)}
    h1{font-size:1.4rem;margin-top:0;color:#1f7a5a}
    #status{line-height:1.7;white-space:pre-wrap}
    .ok{color:#18794e}.error{color:#b42318}
    button{border:0;border-radius:10px;padding:.8rem 1rem;background:#1f7a5a;color:#fff;font-weight:700;font-size:1rem}
  </style>
</head>
<body>
<main>
  <h1>PWA 快取安全復原</h1>
  <p>本流程只移除 Service Worker 與網頁程式快取，不會刪除 IndexedDB／SQLite 個人資料。</p>
  <div id="status">準備復原…</div>
  <p><button id="retry" hidden>重新執行</button></p>
</main>
<script>
(function(){
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  async function recover(){
    retry.hidden=true;
    try{
      status.textContent='1/3 解除舊 Service Worker…';
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
      }
      status.textContent='2/3 清除程式快取…';
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(key=>caches.delete(key)));
      }
      status.textContent='3/3 復原完成，正在載入最新版…';
      status.className='ok';
      const target=new URL('./',location.href);
      target.searchParams.set('recovered',Date.now().toString());
      setTimeout(()=>location.replace(target.href),800);
    }catch(error){
      console.error(error);
      status.textContent=`復原失敗：${error.message||error}\n請按下方按鈕重試。`;
      status.className='error';
      retry.hidden=false;
    }
  }
  retry.onclick=recover;
  recover();
})();
</script>
</body>
</html>
