name: Frontend Regression Gate - DATA.1D.1 OCR Overlay Bootstrap Integration
on:
  pull_request:
    paths:
      - 'assets/js/**'
      - 'service-worker.js'
      - 'scripts/data1d1-ocr-overlay-bootstrap-integration-regression.mjs'
      - '.github/workflows/data1d1-ocr-overlay-bootstrap-integration.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/data1d1-ocr-overlay-bootstrap-integration-regression.mjs
