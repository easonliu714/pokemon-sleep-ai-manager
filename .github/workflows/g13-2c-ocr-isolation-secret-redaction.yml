name: G13.2C OCR Isolation and Secret Redaction

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  g13-2c-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run G13.2C gate
        run: node tests/g13_2c_ocr_isolation_secret_redaction_gate.mjs
