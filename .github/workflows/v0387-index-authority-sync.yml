name: V0.3.87 Index Authority Sync

on:
  push:
    branches:
      - hotfix/v0387-indexeddb-safe-boot-memory-guard
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  synchronize-index-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0387-indexeddb-safe-boot-memory-guard
      - name: Update index cache authority
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '20260805-v0385-database-boot-isolation'
          new = '20260805-v0387-indexeddb-safe-boot-memory-guard'
          updated = text.replace(old, new)
          if updated == text:
              print('index authority already synchronized or source marker missing')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit synchronized index
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(v0.3.87): synchronize index runtime authority'
          git push origin HEAD:hotfix/v0387-indexeddb-safe-boot-memory-guard
