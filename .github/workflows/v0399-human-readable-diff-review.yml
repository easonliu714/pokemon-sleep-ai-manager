name: V0.3.99.3 Public Pokemon Master Coverage and Projection Integrity

on:
  pull_request:
    paths:
      - 'assets/js/general-update-field-audit-ui.js'
      - 'assets/js/pokemon-detail.js'
      - 'assets/js/manual-editor.js'
      - 'assets/js/ai-observation.js'
      - 'assets/js/shared-knowledge-ui.js'
      - 'assets/js/public-pokemon-knowledge-master.js'
      - 'assets/js/public-pokemon-knowledge-coverage.js'
      - 'assets/js/v03992-update-center-guided-ux.js'
      - 'assets/js/v03993-projection-integrity.js'
      - 'assets/js/v03993-public-knowledge-coverage-ui.js'
      - 'assets/js/migrations.js'
      - 'assets/css/v0399-review.css'
      - 'assets/css/editor.css'
      - 'assets/js/version-authority.js'
      - '.github/workflows/v0399-human-readable-diff-review.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax
        run: |
          node --check assets/js/general-update-field-audit-ui.js
          node --check assets/js/pokemon-detail.js
          node --check assets/js/manual-editor.js
          node --check assets/js/ai-observation.js
          node --check assets/js/shared-knowledge-ui.js
          node --check assets/js/public-pokemon-knowledge-master.js
          node --check assets/js/public-pokemon-knowledge-coverage.js
          node --check assets/js/v03992-update-center-guided-ux.js
          node --check assets/js/v03993-projection-integrity.js
          node --check assets/js/v03993-public-knowledge-coverage-ui.js
          node --check assets/js/migrations.js
      - name: Coverage engine executable contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {auditPublicPokemonKnowledgeBundle,buildObservedProjectionCoverage} from './assets/js/public-pokemon-knowledge-coverage.js';
          const bundle=auditPublicPokemonKnowledgeBundle();
          if(!bundle.ok) throw new Error(`bundle integrity failed: ${bundle.errors.join('; ')}`);
          if(bundle.manifest.nature_rows!==25||bundle.manifest.nature_expected!==25) throw new Error('nature coverage must be 25/25');
          if(bundle.manifest.player_rows_may_be_mutated!==false||bundle.manifest.projection_only!==true) throw new Error('projection-only manifest violated');
          if(bundle.manifest.evolution_coverage_status!=='PARTIAL_VERIFIED_ONLY_NON_TERMINAL') throw new Error('evolution partial semantics missing');
          const sample=buildObservedProjectionCoverage([
            {nature:'固執',main_skill:'夢魘（能量填充M）',type:'惡',current_species:'伊布'},
            {nature:'測試未收錄性格',main_skill:'測試未收錄技能',type:'測試未收錄屬性',current_species:'測試未收錄物種'},
          ]);
          if(sample.nature.resolved!==1||sample.nature.unresolved!==1) throw new Error('nature observed coverage split failed');
          if(sample.main_skill.resolved!==1||sample.main_skill.unresolved!==1) throw new Error('main skill observed coverage split failed');
          if(!sample.evolution.verified_outgoing_values.includes('伊布')) throw new Error('verified outgoing evolution route fixture failed');
          if(sample.evolution.semantics!=='UNKNOWN_OR_TERMINAL_NOT_CLASSIFIED') throw new Error('no-route semantics must stay non-terminal');
          console.log('v0.3.99.3 coverage engine executable contract PASS');
          NODE
      - name: Guided review and public knowledge contract
        shell: bash
        run: |
          set -euo pipefail
          UI='assets/js/general-update-field-audit-ui.js'
          DETAIL='assets/js/pokemon-detail.js'
          MANUAL='assets/js/manual-editor.js'
          OBS='assets/js/ai-observation.js'
          KNOWLEDGE='assets/js/shared-knowledge-ui.js'
          MASTER='assets/js/public-pokemon-knowledge-master.js'
          COVERAGE='assets/js/public-pokemon-knowledge-coverage.js'
          COVERAGE_UI='assets/js/v03993-public-knowledge-coverage-ui.js'
          PROJECTION='assets/js/v03993-projection-integrity.js'
          GUIDED='assets/js/v03992-update-center-guided-ux.js'
          MIGRATIONS='assets/js/migrations.js'
          CSS='assets/css/v0399-review.css'
          VERSION='assets/js/version-authority.js'

          grep -q "app_version: 'v0.3.99.3'" "$VERSION"
          grep -q "app_build: '20260808-v03993-public-pokemon-master-coverage-projection-integrity'" "$VERSION"

          # v0.3.99.1 review-only and game-native semantics remain mandatory.
          grep -q 'human_diff_review_ready' "$UI"
          grep -q 'REVIEW-ONLY-' "$UI"
          grep -q 'appliedUpdateId' "$UI"
          grep -q '唯讀比對模式' "$UI"
          grep -q '已可執行 Dry Run' "$UI"
          grep -q "SLEEP_FIELDS = new Set(\['sleep_hours','sleep_time_text'\])" "$UI"
          grep -q "sleep_time_text:\['一起睡覺的時間'\]" "$UI"
          grep -q '進化所需一起睡覺的時間' "$UI"
          grep -q '玩家資料無差異' "$UI"
          grep -q '此次不會改變可見的寶可夢能力' "$UI"
          grep -q '食材配置' "$UI"
          grep -q '副技能' "$UI"
          grep -q 'Identity fingerprint' "$UI"
          grep -q 'review-detail-grid' "$CSS"
          grep -q 'no-player-change' "$CSS"
          grep -q 'profile_audit_confirmations.map' "$UI"
          grep -q "confirmation_scope:'review_preview_only'" "$UI"

          grep -q "\['一起睡覺的時間',sleepDisplay(p)\]" "$DETAIL"
          grep -q "\['登錄日期',p.registered_at\]" "$DETAIL"
          grep -q "\['入手日期',p.obtained_at\]" "$DETAIL"
          grep -q '個體／匯入條件優先' "$DETAIL"
          grep -q '公版進化條件' "$DETAIL"
          grep -q '公版引用' "$DETAIL"
          grep -q 'knowledge.mainSkill' "$DETAIL"
          grep -q 'knowledge.nature' "$DETAIL"

          grep -q '遊戲畫面若出現「一起睡覺的時間」' "$OBS"
          grep -q 'sleep_time_text:null,sleep_hours:null' "$OBS"
          grep -q '不得由等級、入手日期或其他欄位推算' "$OBS"

          # Complete manual editor must not silently drop fields shown by detail UI.
          grep -q "'main_skill_description'" "$MANUAL"
          grep -q "'sleep_hours'" "$MANUAL"
          grep -q "'sleep_time_text'" "$MANUAL"
          grep -q "'registered_at'" "$MANUAL"
          grep -q "'obtained_at'" "$MANUAL"
          grep -q "'evolution_sleep_hours_required'" "$MANUAL"
          grep -q "'evolution_item_required'" "$MANUAL"

          # Versioned public Pokémon knowledge remains projection-only.
          grep -q "PUBLIC_POKEMON_KNOWLEDGE_VERSION='pokemon-knowledge-2026-08-08-a'" "$MASTER"
          grep -q 'CREATE TABLE IF NOT EXISTS nature_master' "$MASTER"
          grep -q 'CREATE TABLE IF NOT EXISTS main_skill_master' "$MASTER"
          grep -q 'CREATE TABLE IF NOT EXISTS pokemon_evolution_master' "$MASTER"
          grep -q "public_pokemon_knowledge_version" "$MASTER"
          grep -q 'player_tables_untouched:true' "$MASTER"
          grep -q 'projection_only:true' "$MASTER"
          grep -q 'NOT_YET_VERIFIED_NOT_NO_EVOLUTION' "$MASTER"

          # v0.3.99.3 coverage and non-terminal missing-route semantics.
          grep -q 'COMPLETE_GAME_VISIBLE_EFFECT_AXES' "$COVERAGE"
          grep -q 'PARTIAL_VERIFIED_ONLY_NON_TERMINAL' "$COVERAGE"
          grep -q 'UNKNOWN_OR_TERMINAL_NOT_CLASSIFIED' "$COVERAGE"
          grep -q 'nature_expected:25' "$COVERAGE"
          grep -q 'player_rows_may_be_mutated:false' "$COVERAGE"
          grep -q 'Pokémon 公版 Master Coverage' "$COVERAGE_UI"
          grep -q 'Bundle Integrity PASS' "$COVERAGE_UI"
          grep -q '沒有 route 的物種不可判定為「不能進化」' "$COVERAGE_UI"

          # Legacy auto-fill is intercepted: select changes remain user edits,
          # but public nature/berry knowledge is not persisted into player fields.
          grep -q "id!=='pokemonNatureSelect'&&id!=='pokemonTypeSelect'" "$PROJECTION"
          grep -q 'event.stopImmediatePropagation()' "$PROJECTION"
          grep -q '依屬性公版投影；不寫入玩家資料' "$PROJECTION"
          grep -q '公版 Projection 保護' "$PROJECTION"

          grep -q "pokemon_knowledge:settingValue" "$MIGRATIONS"
          grep -q "pokemon_knowledge:PUBLIC_POKEMON_KNOWLEDGE_VERSION" "$MIGRATIONS"
          grep -q 'applyPublicPokemonKnowledgeData(db)' "$MIGRATIONS"
          grep -q 'v03993-projection-integrity.js' "$MIGRATIONS"
          grep -q 'v03993-public-knowledge-coverage-ui.js' "$MIGRATIONS"

          if grep -q 'UPDATE pokemon SET favorite_berry' "$MIGRATIONS"; then
            echo 'public type/berry master must never write favorite_berry into player pokemon rows' >&2
            exit 1
          fi
          if grep -q 'profile-preview-key' "$UI"; then
            echo 'raw JSON key/value preview must not be the primary review UI' >&2
            exit 1
          fi
          if grep -q "DETAIL_FIELDS = .*'sleep_hours'.*'sleep_time_text'" "$UI"; then
            echo 'sleep_hours and sleep_time_text must not render as duplicate primary fields' >&2
            exit 1
          fi
          if grep -Eq 'UPDATE pokemon SET .*nature_bonus|UPDATE pokemon SET .*main_skill_description|UPDATE pokemon SET .*evolution_.*SELECT .*master' "$MASTER"; then
            echo 'public Pokémon knowledge must not be written into player pokemon rows' >&2
            exit 1
          fi
          echo 'v0.3.99.3 public master coverage and projection integrity contract PASS'
