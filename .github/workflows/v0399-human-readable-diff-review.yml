name: V0.4.0.4 Post Apply Terminal State And Inventory Summary

on:
  pull_request:
    paths:
      - 'assets/js/app.js'
      - 'assets/js/ai-workflow.js'
      - 'assets/js/general-update-field-audit-ui.js'
      - 'assets/js/update-review-summary.js'
      - 'assets/js/pokemon-detail.js'
      - 'assets/js/manual-editor.js'
      - 'assets/js/ai-observation.js'
      - 'assets/js/shared-knowledge-ui.js'
      - 'assets/js/shared-master-data.js'
      - 'assets/js/public-pokemon-knowledge-master.js'
      - 'assets/js/public-pokemon-knowledge-coverage.js'
      - 'assets/js/v03992-update-center-guided-ux.js'
      - 'assets/js/v03993-projection-integrity.js'
      - 'assets/js/v03993-public-knowledge-coverage-ui.js'
      - 'assets/js/debug-trace-manager.js'
      - 'assets/js/migrations.js'
      - 'assets/css/v0399-review.css'
      - 'assets/css/editor.css'
      - 'assets/js/version-authority.js'
      - '.github/workflows/v0399-human-readable-diff-review.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/ai-workflow.js
          node --check assets/js/general-update-field-audit-ui.js
          node --check assets/js/update-review-summary.js
          node --check assets/js/pokemon-detail.js
          node --check assets/js/manual-editor.js
          node --check assets/js/ai-observation.js
          node --check assets/js/shared-knowledge-ui.js
          node --check assets/js/shared-master-data.js
          node --check assets/js/public-pokemon-knowledge-master.js
          node --check assets/js/public-pokemon-knowledge-coverage.js
          node --check assets/js/v03992-update-center-guided-ux.js
          node --check assets/js/v03993-projection-integrity.js
          node --check assets/js/v03993-public-knowledge-coverage-ui.js
          node --check assets/js/debug-trace-manager.js
          node --check assets/js/migrations.js
      - name: Coverage engine executable contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {auditPublicPokemonKnowledgeBundle,buildObservedProjectionCoverage,resolvePublicMainSkillName} from './assets/js/public-pokemon-knowledge-coverage.js';
          const bundle=auditPublicPokemonKnowledgeBundle();
          if(!bundle.ok) throw new Error(`bundle integrity failed: ${bundle.errors.join('; ')}`);
          if(bundle.manifest.nature_rows!==25||bundle.manifest.nature_expected!==25) throw new Error('nature coverage must be 25/25');
          if(bundle.manifest.player_rows_may_be_mutated!==false||bundle.manifest.projection_only!==true) throw new Error('projection-only manifest violated');
          if(bundle.manifest.evolution_triage_status!=='VERIFIED_OUTGOING_OR_VERIFIED_TERMINAL_OR_UNKNOWN') throw new Error('three-state evolution triage missing');
          if(bundle.manifest.evolution_verified_terminal_rows<1) throw new Error('verified terminal master must not be empty');
          const aliases=new Map([
            ['樹果遞增','樹果遽增'],
            ['樹果速增','樹果遽增'],
            ['流星群（樹果遞增）','流星群（樹果遽增）'],
            ['流星群（樹果速增）','流星群（樹果遽增）'],
          ]);
          for(const [legacy,canonical] of aliases){
            const resolved=resolvePublicMainSkillName(legacy);
            if(resolved!==canonical) throw new Error(`legacy skill alias failed: ${legacy} -> ${resolved}`);
          }
          if(resolvePublicMainSkillName('樹果遽增\u200B')!=='樹果遽增') throw new Error('zero-width canonical skill must resolve');
          const sample=buildObservedProjectionCoverage([
            {nature:'固執',main_skill:'食材精選S',type:'惡',current_species:'小果然'},
            {nature:'認真',main_skill:'蓄力(能量填充S)',type:'電',current_species:'小拳石'},
            {nature:'自大',main_skill:'樹果遞增',type:'飛行',current_species:'小磁怪'},
            {nature:'勤奮',main_skill:'樹果遽增\u200B',type:'蟲',current_species:'巴大蝶'},
            {nature:'浮躁',main_skill:'禮物(食材獲取S)',type:'地面',current_species:'土王'},
            {nature:'測試未收錄性格',main_skill:'測試未收錄技能',type:'測試未收錄屬性',current_species:'測試未收錄物種'},
          ]);
          if(sample.nature.resolved!==5||sample.nature.unresolved!==1) throw new Error('nature observed coverage split failed');
          if(sample.main_skill.resolved!==5||sample.main_skill.unresolved!==1) throw new Error(`observed main skill closure failed: ${JSON.stringify(sample.main_skill)}`);
          if(sample.main_skill.unresolved_values.includes('樹果遞增')) throw new Error('legacy typo must resolve to canonical master');
          if(sample.main_skill.unresolved_values.includes('樹果遽增\u200B')) throw new Error('zero-width skill label must resolve to canonical master');
          for(const species of ['小果然','小拳石','小磁怪']) if(!sample.evolution.verified_outgoing_values.includes(species)) throw new Error(`verified outgoing fixture failed: ${species}`);
          for(const species of ['巴大蝶','土王']) if(!sample.evolution.verified_terminal_values.includes(species)) throw new Error(`verified terminal fixture failed: ${species}`);
          if(!sample.evolution.unknown_evolution_status_values.includes('測試未收錄物種')) throw new Error('unknown evolution fixture failed');
          if(sample.evolution.terminal_semantics!=='VERIFIED_TERMINAL_CURRENT_SLEEP') throw new Error('terminal semantics mismatch');
          if(sample.evolution.unknown_semantics!=='UNKNOWN_NOT_YET_VERIFIED') throw new Error('unknown evolution semantics mismatch');
          console.log('v0.4.0.4 coverage engine canonical resolution contract PASS');
          NODE
      - name: Update package classification contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {validateWorkflow} from './assets/js/ai-workflow.js';
          const manifest={
            generated_at:'2026-08-08T00:00:00+08:00',
            target_runtime:'v0.4.0.4',
            files:[{file:'ingredient.json'},{file:'item.json'}],
            safety:{private_data_must_not_be_committed_to_github:true},
          };
          const manifestResult=validateWorkflow(manifest);
          if(manifestResult.errors.length!==1) throw new Error(`manifest should have one targeted blocking message: ${JSON.stringify(manifestResult)}`);
          if(!manifestResult.errors[0].includes('Package Manifest')) throw new Error('manifest targeted message missing');
          if(manifestResult.summary.file_kind!=='package_manifest'||manifestResult.summary.non_executable_manifest!==true) throw new Error('manifest classification summary missing');
          const base={schema_version:'1.1',generated_at:'2026-08-08T00:00:00+08:00',source:'synthetic contract fixture'};
          const ingredient={...base,update_id:'TEST-INGREDIENT',scenario:'ingredient_inventory_update',operations:[{operation_id:'OP-1',entity:'ingredient_inventory',action:'upsert',key:{ingredient_name:'好眠番茄'},data:{quantity:0},clear_fields:[],review_required:false}]};
          const ingredientResult=validateWorkflow(ingredient);
          if(ingredientResult.errors.length||ingredientResult.review.length) throw new Error(`ingredient inventory compatibility failed: ${JSON.stringify(ingredientResult)}`);
          const item={...base,update_id:'TEST-ITEM',scenario:'item_inventory_update',operations:[{operation_id:'OP-1',entity:'item_inventory',action:'upsert',key:{item_name:'月之石'},data:{quantity:1},clear_fields:[],review_required:false}]};
          const itemResult=validateWorkflow(item);
          if(itemResult.errors.length||itemResult.review.length) throw new Error(`item inventory compatibility failed: ${JSON.stringify(itemResult)}`);
          console.log('v0.4.0.4 update package classification contract PASS');
          NODE
      - name: Scenario-aware review summary contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {buildScenarioReviewSummary} from './assets/js/update-review-summary.js';
          const field=(existing,effective)=>({existing,effective});
          const ingredient=buildScenarioReviewSummary(
            {scenario:'ingredient_inventory_update'},
            {changes:[{entity:'ingredient_inventory',field_audit:[field(null,9),field(null,'2026-08-08'),field(null,'UPD-1')]}]},
          );
          if(ingredient?.title!=='1 筆食材庫存資料將更新'||ingredient.changed_field_count!==3) throw new Error(`ingredient summary mismatch: ${JSON.stringify(ingredient)}`);
          if(!ingredient.detail.includes('不包含玩家寶可夢能力更新')) throw new Error('ingredient scope message missing');
          const item=buildScenarioReviewSummary(
            {scenario:'item_inventory_update'},
            {changes:[{entity:'item_inventory',field_audit:[field(1,1),field('old','old')]}]},
          );
          if(item?.title!=='✓ 1 筆道具庫存資料無差異') throw new Error(`item summary mismatch: ${JSON.stringify(item)}`);
          const pokemon=buildScenarioReviewSummary(
            {scenario:'pokemon_profile_field_audit_update'},
            {changes:[{entity:'pokemon',field_audit:[field(1,2)]}]},
          );
          if(pokemon!==null) throw new Error('Pokemon packages must keep the dedicated Pokemon review summary');
          console.log('v0.4.0.4 scenario-aware review summary contract PASS');
          NODE
      - name: Public master projection and historical UI contract
        shell: bash
        run: |
          set -euo pipefail
          UI='assets/js/general-update-field-audit-ui.js'
          REVIEW_SUMMARY='assets/js/update-review-summary.js'
          DETAIL='assets/js/pokemon-detail.js'
          MANUAL='assets/js/manual-editor.js'
          OBS='assets/js/ai-observation.js'
          MASTER='assets/js/public-pokemon-knowledge-master.js'
          SHARED_MASTER='assets/js/shared-master-data.js'
          COVERAGE='assets/js/public-pokemon-knowledge-coverage.js'
          COVERAGE_UI='assets/js/v03993-public-knowledge-coverage-ui.js'
          PROJECTION='assets/js/v03993-projection-integrity.js'
          GUIDED='assets/js/v03992-update-center-guided-ux.js'
          DEBUG='assets/js/debug-trace-manager.js'
          MIGRATIONS='assets/js/migrations.js'
          WORKFLOW='assets/js/ai-workflow.js'
          CSS='assets/css/v0399-review.css'
          VERSION='assets/js/version-authority.js'

          grep -q "app_version: 'v0.4.0.4'" "$VERSION"
          grep -q "app_build: '20260808-v04004-post-apply-terminal-state-inventory-summary'" "$VERSION"
          grep -q "PUBLIC_POKEMON_KNOWLEDGE_VERSION='pokemon-knowledge-2026-08-08-b'" "$MASTER"

          # v0.3.99.x review-only, game-native and mobile fixes remain mandatory.
          grep -q 'human_diff_review_ready' "$UI"
          grep -q 'REVIEW-ONLY-' "$UI"
          grep -q 'appliedUpdateId' "$UI"
          grep -q '唯讀比對模式' "$UI"
          grep -q '已可執行 Dry Run' "$UI"
          grep -q "SLEEP_FIELDS = new Set(\['sleep_hours','sleep_time_text'\])" "$UI"
          grep -q "sleep_time_text:\['一起睡覺的時間'\]" "$UI"
          grep -q '進化所需一起睡覺的時間' "$UI"
          grep -q '玩家資料無差異' "$UI"
          grep -q '此次不會改變可見的寶可夢能力' "$UI"
          grep -q '食材配置' "$UI"
          grep -q '副技能' "$UI"
          grep -q 'Identity fingerprint' "$UI"
          grep -q 'review-detail-grid' "$CSS"
          grep -q 'no-player-change' "$CSS"
          grep -q 'profile_audit_confirmations.map' "$UI"
          grep -q "confirmation_scope:'review_preview_only'" "$UI"

          grep -q "\['登錄日期',p.registered_at\]" "$DETAIL"
          if grep -q "\['入手日期',p.obtained_at\]" "$DETAIL"; then
            echo 'legacy obtained_at must not render in Pokemon detail' >&2
            exit 1
          fi
          if grep -q "input('obtained_at'" "$DETAIL"; then
            echo 'legacy obtained_at must not remain in manual detail editor' >&2
            exit 1
          fi
          if grep -q "'obtained_at'" "$MANUAL"; then
            echo 'manual editor must preserve legacy obtained_at rather than overwrite it' >&2
            exit 1
          fi
          grep -q 'resolvePublicMainSkillName' "$DETAIL"
          grep -q 'PUBLIC_MAIN_SKILL_MASTER' "$DETAIL"
          grep -q 'mainSkillDisplay(p,knowledge)' "$DETAIL"
          grep -q 'mainSkillDescriptionDisplay(p,knowledge)' "$DETAIL"
          grep -q '原始玩家觀察值仍保留於 SQLite' "$DETAIL"
          grep -q 'replaceAll.*（' "$DETAIL"
          grep -q '個體／匯入條件優先' "$DETAIL"
          grep -q '公版進化條件' "$DETAIL"
          grep -q '公版引用' "$DETAIL"
          grep -q '遊戲畫面若出現「一起睡覺的時間」' "$OBS"
          grep -q 'sleep_time_text:null,sleep_hours:null' "$OBS"
          grep -q '不得由等級、入手日期或其他欄位推算' "$OBS"

          grep -q 'buildScenarioReviewSummary' "$UI"
          grep -q 'ingredient_inventory_update' "$REVIEW_SUMMARY"
          grep -q 'item_inventory_update' "$REVIEW_SUMMARY"
          grep -q '食材庫存資料' "$REVIEW_SUMMARY"
          grep -q '道具庫存資料' "$REVIEW_SUMMARY"
          grep -q '不包含玩家寶可夢能力更新' "$REVIEW_SUMMARY"

          grep -q 'normalized=text.match(/結構錯誤' "$GUIDED"
          grep -q '#workflowSummary{max-height' "$GUIDED"
          grep -q '#workflowIssues{max-height' "$GUIDED"
          grep -q 'text.replace(normalized\[0\],replacement)' "$GUIDED"
          grep -q "import {scalar} from './database.js'" "$GUIDED"
          grep -q 'function appliedComplete' "$GUIDED"
          grep -q '套用更新已完成；本機 SQLite 已寫入' "$GUIDED"
          grep -q 'guided-apply-ready' "$GUIDED"
          grep -q 'ingredientInventorySummary' "$GUIDED"
          grep -q 'itemInventorySummary' "$GUIDED"
          grep -q '食材類別數' "$GUIDED"
          grep -q '道具類別數' "$GUIDED"
          grep -q '庫存總量' "$GUIDED"
          grep -q '可動用總量' "$GUIDED"
          grep -q "key==='events'?value.slice(-MAX_EVENTS)" "$DEBUG"
          grep -q 'saved.slice(-MAX_EVENTS).map' "$DEBUG"

          # v0.4.0.2 resolver-only compatibility aliases and non-executable package manifest UX remain mandatory.
          grep -q 'LEGACY_SKILL_CANONICAL_ALIASES' "$COVERAGE"
          grep -q "樹果遞增.*樹果遽增" "$COVERAGE"
          grep -q "流星群（樹果遞增）.*流星群（樹果遽增）" "$COVERAGE"
          grep -q 'resolvePublicMainSkillName' "$COVERAGE"
          grep -q 'detectNonExecutableFileKind' "$WORKFLOW"
          grep -q 'Package Manifest' "$WORKFLOW"
          grep -q 'non_executable_manifest:true' "$WORKFLOW"

          # Public Pokémon knowledge schema, observed skill closure, and three-state evolution triage.
          grep -q 'CREATE TABLE IF NOT EXISTS nature_master' "$MASTER"
          grep -q 'CREATE TABLE IF NOT EXISTS main_skill_master' "$MASTER"
          grep -q 'CREATE TABLE IF NOT EXISTS pokemon_evolution_master' "$MASTER"
          grep -q 'CREATE TABLE IF NOT EXISTS pokemon_evolution_status_master' "$MASTER"
          grep -q 'PUBLIC_EVOLUTION_STATUS_MASTER' "$MASTER"
          for skill in '食材精選S' '蓄力（能量填充S）' '樹果遽增' '樹果速增' '禮物（食材獲取S）'; do grep -q "$skill" "$MASTER"; done
          for species in '小果然' '果然翁' '小拳石' '隆隆石' '小磁怪' '三合一磁怪' '不良蛙' '毒骷蛙' '六尾' '九尾'; do grep -q "$species" "$MASTER"; done
          grep -q 'VERIFIED_TERMINAL_CURRENT_SLEEP' "$MASTER"
          grep -q 'VERIFIED_OUTGOING_OR_VERIFIED_TERMINAL_OR_UNKNOWN' "$COVERAGE"
          grep -q 'UNKNOWN_NOT_YET_VERIFIED' "$COVERAGE"
          grep -q 'SKILL_INVISIBLE_FORMAT_RE' "$COVERAGE"
          grep -q 'normalizeSkillPunctuation' "$COVERAGE"
          grep -q '已核對終階物種' "$COVERAGE_UI"
          grep -q '仍待核對 evolution status 的物種' "$COVERAGE_UI"
          grep -q 'Bundle Integrity PASS' "$COVERAGE_UI"

          # Historical compatibility semantics remain exported, but are no longer the primary triage UI.
          grep -q 'PARTIAL_VERIFIED_ONLY_NON_TERMINAL' "$COVERAGE"
          grep -q 'UNKNOWN_OR_TERMINAL_NOT_CLASSIFIED' "$COVERAGE"

          # Every public master path is projection-only. No master sync may write favorite_berry into player rows.
          grep -q "id!=='pokemonNatureSelect'&&id!=='pokemonTypeSelect'" "$PROJECTION"
          grep -q 'event.stopImmediatePropagation()' "$PROJECTION"
          grep -q "pokemon_knowledge:settingValue" "$MIGRATIONS"
          grep -q "pokemon_knowledge:PUBLIC_POKEMON_KNOWLEDGE_VERSION" "$MIGRATIONS"
          grep -q 'Public type→berry knowledge is projection-only' "$SHARED_MASTER"
          if grep -R -Eq 'UPDATE[[:space:]]+pokemon[[:space:]]+SET[[:space:]]+favorite_berry' assets/js; then
            echo 'public type/berry master must never write favorite_berry into player pokemon rows' >&2
            exit 1
          fi
          if grep -q 'profile-preview-key' "$UI"; then
            echo 'raw JSON key/value preview must not be the primary review UI' >&2
            exit 1
          fi
          if grep -q "DETAIL_FIELDS = .*'sleep_hours'.*'sleep_time_text'" "$UI"; then
            echo 'sleep_hours and sleep_time_text must not render as duplicate primary fields' >&2
            exit 1
          fi
          if grep -Eq 'UPDATE pokemon SET .*nature_bonus|UPDATE pokemon SET .*main_skill_description|UPDATE pokemon SET .*evolution_.*SELECT .*master' "$MASTER"; then
            echo 'public Pokémon knowledge must not be written into player pokemon rows' >&2
            exit 1
          fi
          echo 'v0.4.0.4 post-apply terminal state and inventory summary hotfix contract PASS'