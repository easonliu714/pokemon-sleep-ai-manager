name: v0.3.92 Release Authority Generator

on:
  push:
    branches:
      - hotfix/v0392-new-user-database-bootstrap-freeze
    paths:
      - 'assets/js/database.js'
      - 'assets/js/migrations.js'
      - 'scripts/v0392-new-user-bootstrap-gate.mjs'
      - '.github/workflows/v0392-release-authority-generator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate-release-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0392-new-user-database-bootstrap-freeze
          fetch-depth: 0
      - name: Rotate v0.3.92 authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'assets/js/bootstrap.js': [
                  ("const APP_VERSION = 'v0.3.91';", "const APP_VERSION = 'v0.3.92';"),
                  ("const VERSION = '20260806-v0391-worker-lifecycle-race-closure';", "const VERSION = '20260806-v0392-new-user-database-bootstrap-freeze';"),
              ],
              'service-worker.js': [
                  ("const APP_VERSION = 'v0.3.91';", "const APP_VERSION = 'v0.3.92';"),
                  ("const APP_BUILD = '20260806-v0391-worker-lifecycle-race-closure';", "const APP_BUILD = '20260806-v0392-new-user-database-bootstrap-freeze';"),
                  ("const CACHE = 'pokemon-sleep-ai-v0.3.91-v0391-worker-lifecycle-race-closure';", "const CACHE = 'pokemon-sleep-ai-v0.3.92-v0392-new-user-database-bootstrap-freeze';"),
              ],
              'index.html': [
                  ('20260806-v0391-worker-lifecycle-race-closure', '20260806-v0392-new-user-database-bootstrap-freeze'),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                  elif new not in text:
                      raise SystemExit(f'missing release marker in {name}: {old}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated authority
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Authority already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/bootstrap.js service-worker.js index.html
          git commit -m 'chore(v0.3.92): rotate release authority'
          git push origin HEAD:hotfix/v0392-new-user-database-bootstrap-freeze
