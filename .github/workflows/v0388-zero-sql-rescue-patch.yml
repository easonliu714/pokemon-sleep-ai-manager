name: V0.3.88 Zero SQL Rescue Historical Contract Validation

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/database.js'
      - 'assets/js/app.js'
      - 'assets/js/version-authority.js'
      - '.github/workflows/v0388-zero-sql-rescue-patch.yml'
  pull_request:
    paths:
      - 'assets/js/database.js'
      - 'assets/js/app.js'
      - 'assets/js/version-authority.js'
      - '.github/workflows/v0388-zero-sql-rescue-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate central authority and zero-SQL rescue contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          const authoritySource = fs.readFileSync('assets/js/version-authority.js', 'utf8');
          const context = { globalThis: {} };
          vm.runInNewContext(authoritySource, context);
          const authority = context.globalThis.PokemonSleepVersionAuthority;
          assert.ok(authority?.app_version, 'central app_version missing');
          assert.ok(authority?.app_build, 'central app_build missing');
          assert.ok(authority?.cache_name, 'central cache_name missing');

          const database = fs.readFileSync('assets/js/database.js', 'utf8');
          const app = fs.readFileSync('assets/js/app.js', 'utf8');
          assert.match(database, /RESCUE_READY/);
          assert.match(database, /BOOTSTRAP_COMPLETE/);
          assert.match(database, /rescueReadonly/);
          assert.match(database, /if\s*\(rescueReadonly\)\s*return\s*\[\]/);
          assert.match(database, /readonly_rescue_mode/);
          assert.match(app, /initializeDatabase/);

          for (const file of ['assets/js/database.js', 'assets/js/app.js']) {
            const source = fs.readFileSync(file, 'utf8');
            assert.doesNotMatch(source, /const\s+APP_VERSION\s*=\s*['"]/,
              `${file} must not define APP_VERSION`);
            assert.doesNotMatch(source, /const\s+CACHE(?:_NAME)?\s*=\s*['"]/,
              `${file} must not define cache authority`);
          }
          console.log('v0.3.88 historical zero-SQL rescue contract PASS');
          NODE
