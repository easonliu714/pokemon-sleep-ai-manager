name: V0.3.88 Zero SQL Rescue Patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0388-zero-sql-rescue
      - name: Apply exact runtime patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('assets/js/database.js')
          s=p.read_text()
          start=s.index('async function createReadonlyRescueDatabase(error){')
          end=s.index('\n}\n\nexport async function inspectDatabaseBoot', start)+2
          new='''async function createReadonlyRescueDatabase(error){
  rescueReadonly=true;
  db=null;
  const detail={seeded:false,rescue:true,readonly:true,zero_sql:true,error_code:error.code,message:error.message,...error.details};
  emit('RESCUE_READY','救援／唯讀模式已就緒；未載入 SQL.js，也未讀取玩家 SQLite','completed',detail);
  emit('BOOTSTRAP_COMPLETE','啟動流程已在零 SQLite 救援模式完成','completed',detail);
  dispatchReady(detail);
  emit('APP_READY','App 已在零 SQLite 救援模式完成啟動','completed',detail);
  return detail;
}'''
          s=s[:start]+new+s[end:]
          s=s.replace("export function isDatabaseReady(){return Boolean(db);}","export function isDatabaseReady(){return Boolean(db)||rescueReadonly;}")
          s=s.replace("export function rows(sql,params=[]){if(!db)throw new Error('database_not_ready');", "export function rows(sql,params=[]){if(rescueReadonly)return [];if(!db)throw new Error('database_not_ready');")
          s=s.replace("export function scalar(sql,params=[]){const r=rows(sql,params);", "export function scalar(sql,params=[]){if(rescueReadonly)return 0;const r=rows(sql,params);")
          s=s.replace("export function exportBytes(){if(!db)throw new Error('database_not_ready');return db.export();}","export function exportBytes(){if(rescueReadonly)throw new Error('readonly_rescue_mode');if(!db)throw new Error('database_not_ready');return db.export();}")
          p.write_text(s)

          p=Path('assets/js/app.js')
          s=p.read_text()
          old="""    const result = await initializeDatabase();
    state.seeded = Boolean(result?.seeded);

    setupG3Pages();
    bindNavigation();

    $('dbStatus').textContent = 'SQLite 已就緒';
    $('dbStatus').className = 'badge ok';
    await refresh();"""
          new="""    const result = await initializeDatabase();
    state.seeded = Boolean(result?.seeded);

    setupG3Pages();
    bindNavigation();

    if (result?.rescue) {
      $('dbStatus').textContent = '救援／唯讀模式';
      $('dbStatus').className = 'badge warning';
      $('storageWarning').textContent = `本機玩家資料尚未載入：${result.message || 'Safe Boot 已啟用'}。目前可瀏覽公版頁面，不會寫入玩家資料。`;
      $('storageWarning').classList.remove('hidden');
    } else {
      $('dbStatus').textContent = 'SQLite 已就緒';
      $('dbStatus').className = 'badge ok';
    }
    await refresh();"""
          if old not in s: raise SystemExit('app start block not found')
          p.write_text(s.replace(old,new))

          for f in ['assets/js/bootstrap.js','assets/js/v0382-release-authority.js','index.html','service-worker.js','service-worker-v0387.js']:
            p=Path(f)
            if not p.exists(): continue
            s=p.read_text()
            s=s.replace('v0.3.87','v0.3.88')
            s=s.replace('20260805-v0387-indexeddb-safe-boot-memory-guard','20260805-v0388-zero-sql-rescue')
            s=s.replace('v0387-indexeddb-safe-boot-memory-guard','v0388-zero-sql-rescue')
            s=s.replace('v0387','v0388')
            p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/database.js assets/js/app.js assets/js/bootstrap.js assets/js/v0382-release-authority.js index.html service-worker.js service-worker-v0387.js
          git commit -m "fix(v0.3.88): zero-SQL rescue mode" || exit 0
          git push origin HEAD:hotfix/v0388-zero-sql-rescue