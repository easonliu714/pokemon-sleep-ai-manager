name: v0.4.22.1 Recipe Formula Authority Audit

on:
  push:
    branches:
      - main
      - 'hotfix/**'
      - 'feature/**'
    paths:
      - 'assets/js/public-recipe-master.js'
      - 'assets/js/public-recipe-canonical-authority.js'
      - 'assets/js/public-recipe-provenance.js'
      - 'assets/js/public-master-recognition.js'
      - 'assets/js/shared-master-data.js'
      - 'scripts/v04221-recipe-formula-authority-audit.mjs'
      - '.github/workflows/v04221-recipe-formula-authority-audit.yml'
  pull_request:
    paths:
      - 'assets/js/public-recipe-master.js'
      - 'assets/js/public-recipe-canonical-authority.js'
      - 'assets/js/public-recipe-provenance.js'
      - 'assets/js/public-master-recognition.js'
      - 'assets/js/shared-master-data.js'
      - 'scripts/v04221-recipe-formula-authority-audit.mjs'
      - '.github/workflows/v04221-recipe-formula-authority-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-formula-authority-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check assets/js/public-recipe-canonical-authority.js
          node --check assets/js/public-recipe-provenance.js
          node --check assets/js/public-master-recognition.js
          node --check scripts/v04221-recipe-formula-authority-audit.mjs
      - name: Full 78-recipe formula authority audit
        run: node scripts/v04221-recipe-formula-authority-audit.mjs
