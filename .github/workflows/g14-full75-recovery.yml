name: G14 FULL75 Recovery Closure

on:
  pull_request:
  push:
    branches: [main]

jobs:
  full75-recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/full75-recovery-contract.js
          node --check assets/js/full75-recovery-engine.js
          node --check assets/js/full75-recovery-workbench.js
          node --check assets/js/general-update-field-audit-ui.js
          node --check assets/js/version-authority.js
      - name: Verify immutable historical FULL75 counts
        run: |
          grep -q "total: 821" assets/js/full75-recovery-contract.js
          grep -q "pokemon_upsert: 75" assets/js/full75-recovery-contract.js
          grep -q "pokemon_archive: 5" assets/js/full75-recovery-contract.js
          grep -q "pokemon_subskills: 369" assets/js/full75-recovery-contract.js
          grep -q "pokemon_ingredients: 222" assets/js/full75-recovery-contract.js
          grep -q "pokemon_identity_evidence: 150" assets/js/full75-recovery-contract.js
      - name: Verify retired compatibility boundary
        run: |
          grep -q "review_required" assets/js/full75-recovery-engine.js
          grep -q "confirmed_independent" assets/js/full75-recovery-engine.js
          grep -q "target_pokemon_id" assets/js/full75-recovery-engine.js
          grep -q "dryRun" assets/js/full75-recovery-engine.js
          grep -q "verifyAppliedPackage" assets/js/full75-recovery-engine.js
          grep -q "throw new Error(RETIRED_MESSAGE)" assets/js/full75-recovery-engine.js
          ! grep -q "import .*applyPayload" assets/js/full75-recovery-engine.js
          grep -q "panel.dataset.status = 'retired'" assets/js/full75-recovery-workbench.js
          grep -q "送至一般更新中心" assets/js/full75-recovery-workbench.js
          grep -q "blank_values_preserve_existing:true" assets/js/full75-recovery-workbench.js
          grep -q "preserve_existing_empty_incoming" assets/js/importer.js
          grep -q "accepted_current_observation" assets/js/ai-workflow.js
      - name: Verify browser compatibility entry
        run: |
          grep -q 'src="./assets/js/full75-recovery-workbench.js"' index.html
          ! grep -q 'full75-recovery-workbench.js?v=' index.html
          grep -q 'assets/js/version-authority.js' service-worker.js
          ! grep -R "PRIVATE-ABILITY-FULL75-REFRESH" assets .github docs --exclude='g14-full75-recovery.yml'
