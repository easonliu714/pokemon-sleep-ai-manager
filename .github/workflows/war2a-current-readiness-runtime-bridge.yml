name: WAR.2A Current Readiness Runtime Bridge

on:
  pull_request:
    paths:
      - 'assets/js/pokemon-candidate-feature-projection.js'
      - 'assets/js/pokemon-scoring-engine.js'
      - 'assets/js/pokemon-scoring-rule-registry.js'
      - 'assets/js/pokemon-candidate-local.js'
      - 'scripts/v042-pokemon-candidate-feature-contract.mjs'
      - 'scripts/v042-pokemon-scoring-engine-contract.mjs'
      - 'scripts/war2a-current-readiness-runtime-bridge-contract.mjs'
      - '.github/workflows/war2a-current-readiness-runtime-bridge.yml'
  workflow_dispatch:

jobs:
  current-readiness-runtime-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify candidate feature contract
        run: node scripts/v042-pokemon-candidate-feature-contract.mjs
      - name: Verify scoring engine contract
        run: node scripts/v042-pokemon-scoring-engine-contract.mjs
      - name: Verify runtime readiness bridge
        run: node scripts/war2a-current-readiness-runtime-bridge-contract.mjs
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node --check assets/js/pokemon-candidate-feature-projection.js
          node --check assets/js/pokemon-scoring-engine.js
          node --check assets/js/pokemon-candidate-local.js
      - name: Verify no tracked test mutation
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
