name: V0.4.10 UC.IMG-A Release

on:
  pull_request:
    paths:
      - 'assets/js/version-authority.js'
      - 'assets/js/unified-screenshot-update-center.js'
      - 'assets/js/candy-inventory-ui.js'
      - 'assets/js/prompt-catalog.js'
      - 'scripts/v0410-release-contract.mjs'
      - 'scripts/v0491-release-contract.mjs'
      - 'scripts/uc-img-a-contract.mjs'
      - '.github/workflows/v0410-uc-img-a-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact v0.4.10 release authority
        run: node scripts/v0410-release-contract.mjs
      - name: Verify UC.IMG-A executable behavior
        run: node scripts/uc-img-a-contract.mjs
      - name: Verify v0.4.9.1 historical WAR.3 behavior
        run: |
          node scripts/v0491-release-contract.mjs
          node scripts/war3c-external-strategy-analysis-pack-contract.mjs
      - name: Verify v0.4.8.5 compact camp historical behavior
        run: node scripts/v0485-release-contract.mjs
      - name: Verify JavaScript syntax
        run: |
          node --check assets/js/unified-screenshot-update-center.js
          node --check assets/js/candy-inventory-ui.js
          node --check assets/js/version-authority.js
