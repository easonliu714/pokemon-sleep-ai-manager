name: V0.3.89 Rescue Catalog Import Gate
on:
  pull_request:
    paths:
      - 'assets/js/v0389-rescue-catalog-import.js'
      - 'assets/js/v0382-image-byte-snapshot.js'
      - 'assets/js/v0382-release-authority.js'
      - 'assets/js/bootstrap.js'
      - 'service-worker.js'
      - 'index.html'
      - 'tests/v0389-rescue-catalog-import-contract.test.mjs'
      - '.github/workflows/v0389-rescue-catalog-import-gate.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/v0389-rescue-catalog-import.js
          node --check assets/js/v0382-image-byte-snapshot.js
          node --check assets/js/v0382-release-authority.js
      - name: Rescue catalog, staging and transition contract
        run: node tests/v0389-rescue-catalog-import-contract.test.mjs
