name: G13.2E Finalize Nonblocking Workbench

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  g13-2e-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run G13.2E gate
        run: node tests/g13_2e_finalize_nonblocking_workbench_gate.mjs
