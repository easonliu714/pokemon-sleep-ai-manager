name: V0.3.91 Worker Lifecycle Race Gate
on:
  pull_request:
    paths:
      - 'assets/js/storage.js'
      - 'assets/js/bootstrap.js'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/v0391-worker-lifecycle-gate.yml'
permissions:
  contents: read
jobs:
  worker-lifecycle-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: JavaScript syntax
        run: |
          node --check assets/js/storage.js
          node --check assets/js/bootstrap.js
          node --check service-worker.js
      - name: Verify captured-instance cancellation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('assets/js/storage.js').read_text()
          cancel=text.split('export function cancelWorkerDatabaseLoad(){',1)[1].split('export function loadDatabaseBytesInWorker',1)[0]
          load=text.split('export function loadDatabaseBytesInWorker',1)[1].split('export async function saveDatabaseBytes',1)[0]
          assert 'const worker=sqliteLoadWorker' in cancel
          assert 'worker.terminate()' in cancel
          assert 'sqliteLoadWorker?.terminate()' not in cancel
          assert 'sqliteLoadWorkerGeneration' in text
          assert 'const isCurrent=' in load
          assert "legacy_db_worker_superseded" in load
          assert "APP_VERSION = 'v0.3.91'" in Path('assets/js/bootstrap.js').read_text()
          assert "pokemon-sleep-ai-v0.3.91-v0391-worker-lifecycle-race-closure" in Path('service-worker.js').read_text()
          assert '20260806-v0391-worker-lifecycle-race-closure' in Path('index.html').read_text()
          print('v0.3.91 worker lifecycle race contract PASS')
          PY
      - name: Simulate stale cancellation timer isolation
        run: |
          node - <<'JS'
          let current={name:'old',terminated:false,terminate(){this.terminated=true}};
          const old=current;
          current=null;
          const next={name:'new',terminated:false,terminate(){this.terminated=true}};
          current=next;
          old.terminate();
          if(!old.terminated||next.terminated)throw new Error('captured worker termination contract failed');
          console.log('stale cancellation cannot terminate replacement worker: PASS');
          JS
