name: Recipe Regression

on:
  pull_request:
  push:
    branches:
      - main
      - 'hotfix/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipe-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  base-current-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify v0.4.2 release integration
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/v042-release-integration-contract.mjs | tee artifacts/v042-release-integration-contract.json
      - name: Verify single public recipe authority
        run: |
          set -o pipefail
          node scripts/v042-public-recipe-authority-contract.mjs | tee artifacts/v042-public-recipe-authority-contract.json
      - name: Verify recipe provenance and active/upcoming boundary
        run: |
          set -o pipefail
          node scripts/v042-recipe-provenance-audit.mjs | tee artifacts/v042-recipe-provenance-audit.json
      - name: Verify deterministic recipe strategy projection
        run: |
          set -o pipefail
          node scripts/v042-recipe-strategy-projection-contract.mjs | tee artifacts/v042-recipe-strategy-projection-contract.json
      - name: Verify War Room recipe UI and weekly category compatibility
        run: |
          set -o pipefail
          node scripts/v042-war-room-recipe-ui-contract.mjs | tee artifacts/v042-war-room-recipe-ui-contract.json
      - name: Verify candidate feature projection
        run: |
          set -o pipefail
          node scripts/v042-pokemon-candidate-feature-contract.mjs | tee artifacts/v042-pokemon-candidate-feature-contract.json
      - name: Verify evidence-gated Pokémon scoring
        run: |
          set -o pipefail
          node scripts/v042-pokemon-scoring-engine-contract.mjs | tee artifacts/v042-pokemon-scoring-engine-contract.json
      - name: Verify Strategy Context privacy contract
        run: |
          set -o pipefail
          node scripts/v042-strategy-context-package-contract.mjs | tee artifacts/v042-strategy-context-package-contract.json
      - name: Install SQL.js fixture runtime
        run: npm install --no-save --ignore-scripts sql.js@1.13.0
      - name: Verify Goal Profile and Evaluation Snapshot contract
        run: |
          set -o pipefail
          node scripts/v042-war-room-goal-evaluation-contract.mjs | tee artifacts/v042-war-room-goal-evaluation-contract.json
      - name: Verify existing DB player-state preservation and idempotency
        run: |
          set -o pipefail
          node scripts/v042-recipe-sync-preservation-contract.mjs | tee artifacts/v042-recipe-sync-preservation-contract.json
      - name: Upload contract reports
        uses: actions/upload-artifact@v4
        with:
          name: recipe-base-current-authority-contracts
          path: artifacts/*.json
          if-no-files-found: error
      - name: Verify no tracked repository mutation
        shell: bash
        run: git diff --exit-code -- . ':!package-lock.json'

  formula-energy-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check assets/js/version-authority.js
          node --check assets/js/public-recipe-canonical-authority.js
          node --check assets/js/public-recipe-provenance.js
          node --check assets/js/public-master-recognition.js
          node --check scripts/v04221-recipe-formula-authority-audit.mjs
          node --check scripts/v04221-release-contract.mjs
          node --check scripts/v0423-predecessor-contract-runner.mjs
      - name: Version authority audit
        run: node scripts/version-authority-audit.mjs
      - name: Full 78-recipe formula authority audit
        run: node scripts/v04221-recipe-formula-authority-audit.mjs
      - name: v0.4.22.1 release authority contract
        run: node scripts/v0423-predecessor-contract-runner.mjs scripts/v04221-release-contract.mjs
      - name: Verify no tracked repository mutation
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"

  zh-tw-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run R2.1 synthetic privacy contract
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v043-recipe-zh-tw-evidence-audit-contract.mjs | tee /tmp/v043-r21-contract.json
      - name: Exercise privacy-safe private-input CLI
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v043-recipe-zh-tw-evidence-audit.mjs --private-file=tests/fixtures/v043_recipe_zh_tw_evidence_sanitized_fixture.json --require-count=5 | tee /tmp/v043-r21-audit.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/v043-r21-audit.json', 'utf8'));
          if (report.database_opened !== false || report.database_write_performed !== false) throw new Error('R2.1 audit must remain database-free/read-only');
          if (report.classification_counts.FORMULA_CONFLICT !== 1) throw new Error('Expected formula conflict fixture was not preserved');
          NODE
      - name: Run full-50 sanitized screenshot reconciliation
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v043-full50-recipe-evidence-contract.mjs | tee /tmp/v043-r21-full50.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/v043-r21-full50.json', 'utf8'));
          if (report.observed_recipe_count !== 50) throw new Error('Full screenshot evidence set must contain exactly 50 recipes');
          if (report.category_counts['咖哩／濃湯'] !== 13 || report.category_counts['沙拉'] !== 17 || report.category_counts['甜點／飲料'] !== 20) throw new Error('Full screenshot evidence category counts drifted');
          if (report.classification_counts.FORMULA_CONFLICT !== 2) throw new Error('R2.1 must preserve exactly two known formula conflicts');
          NODE
      - name: Run R2.2 canonical name and legacy alias contract
        shell: bash
        run: node scripts/v043-r22-recipe-canonical-name-contract.mjs | tee /tmp/v043-r22-contract.json
      - name: Verify projected provenance coverage
        shell: bash
        run: node scripts/v042-recipe-provenance-audit.mjs | tee /tmp/v043-r22-provenance.json
      - name: Run R2.4 controlled selector contract
        shell: bash
        run: node scripts/v043-r24-controlled-selector-contract.mjs | tee /tmp/v043-r24-selector.json
      - name: Run R2.5 deterministic five-member optimizer contract
        shell: bash
        run: node scripts/v043-r25-team-optimizer-contract.mjs | tee /tmp/v043-r25-team.json
      - name: Run R2.6 five-member Team Card UX contract
        shell: bash
        run: node scripts/v043-r26-team-ux-contract.mjs | tee /tmp/v043-r26-team-ux.json
      - name: Install SQL.js fixture runtime
        shell: bash
        run: npm install --no-save --ignore-scripts sql.js@1.13.0
      - name: Run R2.3 existing-player preservation and idempotency
        shell: bash
        run: node scripts/v042-recipe-sync-preservation-contract.mjs | tee /tmp/v043-r23-preservation.json
      - name: Verify migration authority and G14 renderer authority
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          grep -q "PUBLIC_RECIPE_MASTER_VERSION} from './public-recipe-current-authority.js'" assets/js/migrations.js
          if test -f assets/js/recipe-unified-player-workbench.js; then
            grep -q "from './recipe-unified-player-workbench.js'" assets/js/public-catalog-workbench.js
            grep -q "from './public-recipe-current-authority.js'" assets/js/recipe-unified-player-workbench.js
            grep -q "recipe_catalog_state" assets/js/recipe-unified-player-workbench.js
            if grep -Eq "from './public-recipe-(master|canonical-authority)\.js'" assets/js/recipe-unified-player-workbench.js; then echo 'Unified Recipe Workbench bypassed current recipe authority.' >&2; exit 1; fi
          else
            grep -Eq "PUBLIC_RECIPE_MASTER.*PUBLIC_RECIPE_MASTER_VERSION} from './public-recipe-current-authority.js'" assets/js/public-catalog-workbench.js
          fi
          if grep -Eq "from './public-recipe-(master|canonical-authority)\.js'" assets/js/public-catalog-workbench.js; then echo 'Renderer shell bypassed current recipe authority.' >&2; exit 1; fi
          python tests/test_g14_public_catalog_renderer_authority.py
      - name: Verify fixture is synthetic and private source is absent
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          grep -q '"fixture_only": true' tests/fixtures/v043_recipe_zh_tw_evidence_sanitized_fixture.json
          if grep -R --line-number --fixed-strings 'Pokemon_Sleep_PRIVATE_RECIPES_FROM_ZIP_20260731.json' scripts/v043-recipe-zh-tw-evidence-audit*.mjs scripts/v043-full50-recipe-evidence-contract.mjs scripts/v043-r22-recipe-canonical-name-contract.mjs tests/fixtures/v043_recipe_zh_tw_evidence_sanitized_fixture.json assets/data/public-recipe-zh-tw-screenshot-evidence-2026-08-09.json; then echo 'Private source filename must not be embedded in Repo artifacts.' >&2; exit 1; fi
      - name: Verify contracts produced no repository mutation
        shell: bash
        run: git diff --exit-code -- . ':!package-lock.json'

  release-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify v0.4.12 unified recipe player workbench
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v0412-recipe-unified-player-workbench-contract.mjs | tee /tmp/v0412-recipe-workbench.json
          CURRENT_VERSION="$(sed -n "s/^[[:space:]]*app_version: '\([^']*\)',/\1/p" assets/js/version-authority.js | head -n1)"
          if [ "$CURRENT_VERSION" = "v0.4.12" ]; then node scripts/v0412-release-contract.mjs | tee /tmp/v0412-release.json; fi
          node scripts/personal-weekly-recommendation-regression.mjs
          node --check assets/js/recipe-unified-player-workbench.js
          node --check assets/js/public-catalog-workbench.js
          node --check assets/js/shared-knowledge-ui.js
          node --check scripts/v0412-recipe-unified-player-workbench-contract.mjs
          node --check scripts/v0412-release-contract.mjs
      - name: Verify R2.4 controlled selectors
        shell: bash
        run: node scripts/v043-r24-controlled-selector-contract.mjs | tee /tmp/v043-r24.json
      - name: Verify R2.5 deterministic Team Optimizer
        shell: bash
        run: node scripts/v043-r25-team-optimizer-contract.mjs | tee /tmp/v043-r25.json
      - name: Verify R2.6 Team Card UX
        shell: bash
        run: node scripts/v043-r26-team-ux-contract.mjs | tee /tmp/v043-r26.json
      - name: Verify v0.4.2 historical release compatibility
        shell: bash
        run: node scripts/v042-release-integration-contract.mjs | tee /tmp/v042-historical-release.json
      - name: Verify v0.4.3 release integration
        shell: bash
        run: node scripts/v043-release-integration-contract.mjs | tee /tmp/v043-release.json
      - name: Verify no private source committed
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          private_source='Pokemon_Sleep_PRIVATE_''RECIPES_FROM_ZIP_20260731.json'
          if grep -R --line-number --fixed-strings "$private_source" assets/data scripts/v043-*.mjs assets/js/public-recipe-canonical-authority.js; then echo 'Private recipe source filename leaked into release files.' >&2; exit 1; fi
      - name: Verify P7 predecessor/successor parity configuration
        run: node scripts/ci-p7-recipe-regression-parity-contract.mjs
      - name: Verify release checks do not mutate repository
        shell: bash
        run: git diff --exit-code
