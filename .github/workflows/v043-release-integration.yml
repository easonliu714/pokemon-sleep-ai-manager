name: V0.4.3 Release Integration Contract

on:
  pull_request:
    paths:
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'assets/js/public-recipe-canonical-authority.js'
      - 'assets/js/recipe-unified-player-workbench.js'
      - 'assets/js/public-catalog-workbench.js'
      - 'assets/js/shared-knowledge-ui.js'
      - 'assets/css/editor.css'
      - 'assets/js/controlled-selector.js'
      - 'assets/js/war-room-controlled-options.js'
      - 'assets/js/war-room-goal-profile-ui.js'
      - 'assets/js/pokemon-candidate-feature-projection.js'
      - 'assets/js/team-optimizer.js'
      - 'assets/js/team-optimizer-local.js'
      - 'assets/js/war-room-team-optimizer-ui.js'
      - 'assets/js/war-room-team-optimizer-bootstrap.js'
      - 'assets/js/war-room-candidate-feature-ui.js'
      - 'assets/js/war-room-candidate-feature-bootstrap.js'
      - 'assets/js/strategy-context-local.js'
      - 'assets/js/strategy-context-package.js'
      - 'assets/js/strategy-gemini-contract.js'
      - 'scripts/v0412-recipe-unified-player-workbench-contract.mjs'
      - 'scripts/v0412-release-contract.mjs'
      - 'scripts/personal-weekly-recommendation-regression.mjs'
      - 'scripts/v042-*.mjs'
      - 'scripts/v043-*.mjs'
      - '.github/workflows/v043-release-integration.yml'
  push:
    branches:
      - main
    paths:
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'assets/js/public-recipe-canonical-authority.js'
      - 'assets/js/recipe-unified-player-workbench.js'
      - 'assets/js/public-catalog-workbench.js'
      - 'assets/js/shared-knowledge-ui.js'
      - 'assets/css/editor.css'
      - 'assets/js/controlled-selector.js'
      - 'assets/js/war-room-controlled-options.js'
      - 'assets/js/war-room-goal-profile-ui.js'
      - 'assets/js/pokemon-candidate-feature-projection.js'
      - 'assets/js/team-optimizer.js'
      - 'assets/js/team-optimizer-local.js'
      - 'assets/js/war-room-team-optimizer-ui.js'
      - 'assets/js/war-room-team-optimizer-bootstrap.js'
      - 'assets/js/war-room-candidate-feature-ui.js'
      - 'assets/js/war-room-candidate-feature-bootstrap.js'
      - 'assets/js/strategy-context-local.js'
      - 'assets/js/strategy-context-package.js'
      - 'assets/js/strategy-gemini-contract.js'
      - 'scripts/v0412-recipe-unified-player-workbench-contract.mjs'
      - 'scripts/v0412-release-contract.mjs'
      - 'scripts/personal-weekly-recommendation-regression.mjs'
      - 'scripts/v042-*.mjs'
      - 'scripts/v043-*.mjs'
      - '.github/workflows/v043-release-integration.yml'

jobs:
  v043-release-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify v0.4.12 unified recipe player workbench
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v0412-recipe-unified-player-workbench-contract.mjs | tee /tmp/v0412-recipe-workbench.json
          CURRENT_VERSION="$(sed -n "s/^[[:space:]]*app_version: '\([^']*\)',/\1/p" assets/js/version-authority.js | head -n1)"
          if [ "$CURRENT_VERSION" = "v0.4.12" ]; then node scripts/v0412-release-contract.mjs | tee /tmp/v0412-release.json; fi
          node scripts/personal-weekly-recommendation-regression.mjs
          node --check assets/js/recipe-unified-player-workbench.js
          node --check assets/js/public-catalog-workbench.js
          node --check assets/js/shared-knowledge-ui.js
          node --check scripts/v0412-recipe-unified-player-workbench-contract.mjs
          node --check scripts/v0412-release-contract.mjs

      - name: Verify R2.4 controlled selectors
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v043-r24-controlled-selector-contract.mjs | tee /tmp/v043-r24.json

      - name: Verify R2.5 deterministic Team Optimizer
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v043-r25-team-optimizer-contract.mjs | tee /tmp/v043-r25.json

      - name: Verify R2.6 Team Card UX
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v043-r26-team-ux-contract.mjs | tee /tmp/v043-r26.json

      - name: Verify v0.4.2 historical release compatibility
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v042-release-integration-contract.mjs | tee /tmp/v042-historical-release.json

      - name: Verify v0.4.3 release integration
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v043-release-integration-contract.mjs | tee /tmp/v043-release.json

      - name: Verify no private source committed
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          private_source='Pokemon_Sleep_PRIVATE_''RECIPES_FROM_ZIP_20260731.json'
          if grep -R --line-number --fixed-strings "$private_source" \
            assets/data scripts/v043-*.mjs assets/js/public-recipe-canonical-authority.js; then
            echo 'Private recipe source filename leaked into release files.' >&2
            exit 1
          fi

      - name: Verify release checks do not mutate repository
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          git diff --exit-code
