name: v0.4.22 G7.5D Base Berry Output

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'assets/js/base-berry-output-contract.js'
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/production-evidence-registry.js'
      - 'assets/js/team-objective-evaluator.js'
      - 'assets/js/strategy-optimization-pack.js'
      - 'assets/js/production-evidence-ui.js'
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'scripts/v0422-g75d-base-berry-output-contract.mjs'
      - '.github/workflows/v0422-g75d-base-berry-output.yml'
  pull_request:
    paths:
      - 'assets/js/base-berry-output-contract.js'
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/production-evidence-registry.js'
      - 'assets/js/team-objective-evaluator.js'
      - 'assets/js/strategy-optimization-pack.js'
      - 'assets/js/production-evidence-ui.js'
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'scripts/v0422-g75d-base-berry-output-contract.mjs'
      - '.github/workflows/v0422-g75d-base-berry-output.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check G7.5D runtime
        run: |
          node --check assets/js/base-berry-output-contract.js
          node --check assets/js/production-authority-registry.js
          node --check assets/js/production-evidence-registry.js
          node --check assets/js/team-objective-evaluator.js
          node --check assets/js/strategy-optimization-pack.js
          node --check service-worker.js
          node --check scripts/v0422-g75d-base-berry-output-contract.mjs
      - name: Base Berry output numeric authority contract
        run: node scripts/v0422-g75d-base-berry-output-contract.mjs
