name: v0.4.28 G7.5E3C2 Public Species Form Roster

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'assets/js/public-pokemon-species-form-roster.js'
      - 'assets/js/public-pokemon-species-form-roster-readiness.js'
      - 'assets/js/ingredient-probability-activation-policy.js'
      - 'assets/js/public-species-ingredient-rate-reference.js'
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v0428-g75e3c2-public-species-form-roster-contract.mjs'
      - 'scripts/v0428-g75e3c-probability-evidence-policy-contract.mjs'
      - 'scripts/v0427-g75e3b-ingredient-slot-distribution-contract.mjs'
      - 'scripts/v0427-release-contract.mjs'
      - 'scripts/v04251-recipe-current-authority-lock-contract.mjs'
      - '.github/workflows/v0428-g75e3c2-public-species-form-roster.yml'
  pull_request:
    paths:
      - 'assets/js/public-pokemon-species-form-roster.js'
      - 'assets/js/public-pokemon-species-form-roster-readiness.js'
      - 'assets/js/ingredient-probability-activation-policy.js'
      - 'assets/js/public-species-ingredient-rate-reference.js'
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v0428-g75e3c2-public-species-form-roster-contract.mjs'
      - 'scripts/v0428-g75e3c-probability-evidence-policy-contract.mjs'
      - 'scripts/v0427-g75e3b-ingredient-slot-distribution-contract.mjs'
      - 'scripts/v0427-release-contract.mjs'
      - 'scripts/v04251-recipe-current-authority-lock-contract.mjs'
      - '.github/workflows/v0428-g75e3c2-public-species-form-roster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-species-form-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check roster authority
        run: |
          node --check assets/js/public-pokemon-species-form-roster.js
          node --check assets/js/public-pokemon-species-form-roster-readiness.js
          node --check scripts/v0428-g75e3c2-public-species-form-roster-contract.mjs
          node --check scripts/v0428-g75e3c-probability-evidence-policy-contract.mjs
      - name: Verify governed 242-key public roster
        run: node scripts/v0428-g75e3c2-public-species-form-roster-contract.mjs
      - name: Preserve probability activation evidence policy
        run: node scripts/v0428-g75e3c-probability-evidence-policy-contract.mjs
      - name: Preserve v0.4.27 Production boundary
        run: |
          node scripts/v0427-g75e3b-ingredient-slot-distribution-contract.mjs
          node scripts/v0427-release-contract.mjs
      - name: Preserve Recipe 78 current authority
        run: node scripts/v04251-recipe-current-authority-lock-contract.mjs
      - name: Verify roster is catalog-only and read-only
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const file of ['assets/js/public-pokemon-species-form-roster.js','assets/js/public-pokemon-species-form-roster-readiness.js']) {
            const source=fs.readFileSync(file,'utf8');
            for(const forbidden of ['base_ingredient_probability','ingredientPercentage','fetch(', 'localStorage', 'sessionStorage', 'indexedDB', 'INSERT INTO', 'UPDATE ingredient_inventory', 'DELETE FROM', 'applyPayload(', 'dryRun(']) {
              if(source.includes(forbidden)) throw new Error(`${file} contains forbidden catalog/rate/write path: ${forbidden}`);
            }
          }
          NODE
      - name: Verify repository not mutated
        run: git diff --exit-code
