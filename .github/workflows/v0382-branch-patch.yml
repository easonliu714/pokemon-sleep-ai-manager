name: V0.3.82 Historical Contract Validation

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/v0382-image-byte-snapshot.js'
      - 'assets/js/unified-import-analysis-workbench.js'
      - 'assets/js/migrations.js'
      - 'assets/js/shared-master-data.js'
      - 'assets/js/public-recipe-master.js'
      - 'assets/js/public-recipe-master-sync.js'
      - 'assets/js/version-authority.js'
      - '.github/workflows/v0382-branch-patch.yml'
  pull_request:
    paths:
      - 'assets/js/v0382-image-byte-snapshot.js'
      - 'assets/js/unified-import-analysis-workbench.js'
      - 'assets/js/migrations.js'
      - 'assets/js/shared-master-data.js'
      - 'assets/js/public-recipe-master.js'
      - 'assets/js/public-recipe-master-sync.js'
      - 'assets/js/version-authority.js'
      - '.github/workflows/v0382-branch-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate snapshot, migration, public master, and authority contracts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          const required = [
            'assets/js/v0382-image-byte-snapshot.js',
            'assets/js/unified-import-analysis-workbench.js',
            'assets/js/migrations.js',
            'assets/js/shared-master-data.js',
            'assets/js/public-recipe-master.js',
            'assets/js/public-recipe-master-sync.js',
            'assets/js/version-authority.js',
          ];
          for (const file of required) assert.ok(fs.existsSync(file), `${file} missing`);

          const authoritySource = fs.readFileSync('assets/js/version-authority.js', 'utf8');
          const context = { globalThis: {} };
          vm.runInNewContext(authoritySource, context);
          const authority = context.globalThis.PokemonSleepVersionAuthority;
          assert.ok(authority?.app_version);
          assert.ok(authority?.app_build);
          assert.ok(authority?.cache_name);

          const workbench = fs.readFileSync('assets/js/unified-import-analysis-workbench.js', 'utf8');
          const migrations = fs.readFileSync('assets/js/migrations.js', 'utf8');
          const sharedMaster = fs.readFileSync('assets/js/shared-master-data.js', 'utf8');
          const recipeMaster = fs.readFileSync('assets/js/public-recipe-master.js', 'utf8');
          const recipeSync = fs.readFileSync('assets/js/public-recipe-master-sync.js', 'utf8');
          assert.match(workbench, /image_byte_snapshot|sourceBlob|readImage/);
          assert.match(migrations, /schema_migrations|apply.*Migration/i);
          assert.match(sharedMaster, /MASTER_DATA_VERSION/);
          assert.match(sharedMaster, /applySharedMasterData/);
          assert.match(sharedMaster, /ingredient_master/);
          assert.doesNotMatch(sharedMaster, /const\s+RECIPES/);
          assert.match(recipeMaster, /PUBLIC_RECIPE_MASTER_VERSION/);
          assert.match(recipeMaster, /PUBLIC_RECIPE_MASTER/);
          assert.match(recipeSync, /syncPublicRecipeMaster/);
          assert.match(recipeSync, /recipe_master/);
          assert.match(migrations, /public_recipe_master_version/);

          for (const file of required.filter((path) => path !== 'assets/js/version-authority.js')) {
            const source = fs.readFileSync(file, 'utf8');
            assert.doesNotMatch(source, /const\s+APP_VERSION\s*=\s*['"]/,
              `${file} must not define APP_VERSION`);
            assert.doesNotMatch(source, /const\s+CACHE(?:_NAME)?\s*=\s*['"]/,
              `${file} must not define cache authority`);
          }
          console.log('v0.3.82 historical contract PASS');
          NODE
