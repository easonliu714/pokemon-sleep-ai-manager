name: v0.4.23 G7.5E1 Structural Production Modifiers

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'assets/js/version-authority.js'
      - 'assets/js/pokemon-master-options.js'
      - 'assets/js/strategy-optimization-pack.js'
      - 'assets/js/recipe-level-energy-autofill.js'
      - 'service-worker.js'
      - 'scripts/v0423-production-modifier-contract.mjs'
      - 'scripts/v0423-release-contract.mjs'
      - 'scripts/v0423-predecessor-contract-runner.mjs'
      - 'tests/v04221_recipe_level_energy_gate.mjs'
      - '.github/workflows/v0423-g75e1-production-modifier.yml'
  pull_request:
    paths:
      - 'assets/js/version-authority.js'
      - 'assets/js/pokemon-master-options.js'
      - 'assets/js/strategy-optimization-pack.js'
      - 'assets/js/recipe-level-energy-autofill.js'
      - 'service-worker.js'
      - 'scripts/v0423-production-modifier-contract.mjs'
      - 'scripts/v0423-release-contract.mjs'
      - 'scripts/v0423-predecessor-contract-runner.mjs'
      - 'tests/v04221_recipe_level_energy_gate.mjs'
      - '.github/workflows/v0423-g75e1-production-modifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check v0.4.23 runtime and contracts
        run: |
          node --check assets/js/version-authority.js
          node --check assets/js/pokemon-master-options.js
          node --check assets/js/strategy-optimization-pack.js
          node --check assets/js/recipe-level-energy-autofill.js
          node --check service-worker.js
          node --check scripts/v0423-production-modifier-contract.mjs
          node --check scripts/v0423-release-contract.mjs
          node --check scripts/v0423-predecessor-contract-runner.mjs
      - name: Structural production modifier contract
        run: node scripts/v0423-production-modifier-contract.mjs
      - name: Recipe level render hydration contract
        run: node tests/v04221_recipe_level_energy_gate.mjs
      - name: Preserve evidence-gated scoring algorithm contract
        run: node scripts/v042-pokemon-scoring-engine-contract.mjs
      - name: v0.4.23 release authority and privacy contract
        run: node scripts/v0423-release-contract.mjs
