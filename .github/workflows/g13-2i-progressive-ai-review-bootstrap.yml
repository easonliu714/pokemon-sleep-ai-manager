name: G13.2I Progressive AI Review Bootstrap
on:
  pull_request:
    paths:
      - 'assets/js/data1d1-ocr-region-ui.js'
      - 'tests/g13_2i_progressive_ai_review_bootstrap_gate.mjs'
      - '.github/workflows/g13-2i-progressive-ai-review-bootstrap.yml'
  push:
    branches:
      - fix/v0367-single-item-review-bootstrap
    paths:
      - 'assets/js/data1d1-ocr-region-ui.js'
      - 'tests/g13_2i_progressive_ai_review_bootstrap_gate.mjs'
      - '.github/workflows/g13-2i-progressive-ai-review-bootstrap.yml'
jobs:
  g13-2i-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run G13.2I gate
        run: node tests/g13_2i_progressive_ai_review_bootstrap_gate.mjs
