name: G14 Public Catalog Renderer Authority

on:
  pull_request:
  push:
    branches: [main]

jobs:
  public-catalog-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/js/public-catalog-workbench.js
      - name: Renderer authority contract
        run: python tests/test_g14_public_catalog_renderer_authority.py
