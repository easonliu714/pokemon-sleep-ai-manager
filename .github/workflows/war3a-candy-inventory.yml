name: WAR.3A Candy Inventory Resource Context

on:
  pull_request:
    paths:
      - 'assets/js/schema.js'
      - 'assets/js/migrations.js'
      - 'assets/js/public-candy-master.js'
      - 'assets/js/canonical-registry.js'
      - 'assets/js/importer.js'
      - 'assets/js/ai-workflow.js'
      - 'assets/js/prompt-catalog.js'
      - 'assets/js/resource-context.js'
      - 'assets/js/candy-inventory-ui.js'
      - 'assets/js/app.js'
      - 'assets/js/backup-truth-restore.js'
      - 'index.html'
      - 'docs/PUBLIC_MASTER_DATABASE_VERSION_CONTRACT.md'
      - 'scripts/war3a-candy-inventory-contract.mjs'
      - '.github/workflows/war3a-candy-inventory.yml'
  workflow_dispatch:

jobs:
  candy-inventory-resource-context:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify WAR.3A candy inventory contract
        run: node scripts/war3a-candy-inventory-contract.mjs
      - name: Verify v0.4.6.3 release baseline remains green
        run: node scripts/v0463-release-contract.mjs
      - name: Verify v0.4.6.3 Weekly compatibility remains green
        run: node scripts/v0463-weekly-ai-type-repair-contract.mjs
      - name: Verify Recipe Discovery baseline remains green
        run: node scripts/war2b-recipe-discovery-stockpile-contract.mjs
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node --check assets/js/schema.js
          node --check assets/js/migrations.js
          node --check assets/js/public-candy-master.js
          node --check assets/js/canonical-registry.js
          node --check assets/js/importer.js
          node --check assets/js/ai-workflow.js
          node --check assets/js/prompt-catalog.js
          node --check assets/js/resource-context.js
          node --check assets/js/candy-inventory-ui.js
          node --check assets/js/app.js
          node --check assets/js/backup-truth-restore.js
          node --check scripts/war3a-candy-inventory-contract.mjs
      - name: Verify no tracked test mutation
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
