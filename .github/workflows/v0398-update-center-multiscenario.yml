name: V0.3.98 Update Center Multiscenario

on:
  pull_request:
    paths:
      - 'assets/js/importer.js'
      - 'assets/js/ai-workflow.js'
      - 'assets/js/general-update-field-audit-ui.js'
      - 'assets/js/prompt-catalog.js'
      - 'assets/js/version-authority.js'
      - 'tests/test_v0398_update_center_multiscenario_contract.py'
      - '.github/workflows/v0398-update-center-multiscenario.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Multiscenario contract tests
        run: python -m pytest -q tests/test_v0398_update_center_multiscenario_contract.py
      - name: JavaScript syntax
        run: |
          node --check assets/js/importer.js
          node --check assets/js/ai-workflow.js
          node --check assets/js/general-update-field-audit-ui.js
          node --check assets/js/prompt-catalog.js
          node --check assets/js/version-authority.js
      - name: Safety boundaries
        run: |
          grep -q "preserve_existing_empty_incoming" assets/js/importer.js
          grep -q "explicit_zero_and_false_are_values:true" assets/js/importer.js
          grep -q "ingredient_inventory_update" assets/js/ai-workflow.js
          grep -q "item_inventory_update" assets/js/ai-workflow.js
          grep -q "recipe_status_update" assets/js/ai-workflow.js
          grep -q "canonical_payload_synced:true" assets/js/general-update-field-audit-ui.js
          ! grep -R "PRIVATE_CLEAN_BOOTSTRAP_75" assets tests/test_v0398_update_center_multiscenario_contract.py
