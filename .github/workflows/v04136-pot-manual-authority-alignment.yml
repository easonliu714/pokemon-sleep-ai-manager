name: v0.4.13.6 Pot Manual Authority Alignment

on:
  push:
    branches:
      - main
      - 'hotfix/**'
    paths:
      - 'assets/js/weekly-context-ui-bridge.js'
      - 'assets/js/weekly-context-store.js'
      - 'assets/js/weekly-context-manual-override.js'
      - 'assets/js/pot-capacity-authority.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v04136-pot-manual-authority-alignment-contract.mjs'
      - '.github/workflows/v04136-pot-manual-authority-alignment.yml'
  pull_request:
    paths:
      - 'assets/js/weekly-context-ui-bridge.js'
      - 'assets/js/weekly-context-store.js'
      - 'assets/js/weekly-context-manual-override.js'
      - 'assets/js/pot-capacity-authority.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v04136-pot-manual-authority-alignment-contract.mjs'
      - 'scripts/ci-p6a-ucimg-wrapper-parity-contract.mjs'
      - '.github/workflows/uc-img-a.yml'
      - '.github/workflows/v04136-pot-manual-authority-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check weekly context UI bridge
        run: node --check assets/js/weekly-context-ui-bridge.js
      - name: Pot manual authority alignment contract
        run: node scripts/v04136-pot-manual-authority-alignment-contract.mjs
