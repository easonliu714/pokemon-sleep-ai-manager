name: G13.2G Lightweight AI Review and Export Feedback

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  g13-2g-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run G13.2G gate
        run: node tests/g13_2g_lightweight_ai_review_export_feedback_gate.mjs
