name: v0.4.26 G7.5E3A Ingredient Rate Reference Boundary

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'assets/js/public-species-ingredient-rate-reference.js'
      - 'assets/js/ingredient-probability-reference-contract.js'
      - 'assets/js/production-evidence-registry.js'
      - 'assets/js/production-evidence-ui.js'
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'scripts/v0426-g75e3a-species-ingredient-rate-reference-contract.mjs'
      - 'scripts/v0426-release-contract.mjs'
      - '.github/workflows/v0426-g75e3a-ingredient-rate-reference.yml'
  pull_request:
    paths:
      - 'assets/js/**'
      - 'service-worker.js'
      - 'scripts/v0426-g75e3a-species-ingredient-rate-reference-contract.mjs'
      - 'scripts/v0426-release-contract.mjs'
      - '.github/workflows/v0426-g75e3a-ingredient-rate-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check v0.4.26 runtime and contracts
        run: |
          node --check assets/js/public-species-ingredient-rate-reference.js
          node --check assets/js/ingredient-probability-reference-contract.js
          node --check assets/js/production-evidence-registry.js
          node --check assets/js/production-evidence-ui.js
          node --check assets/js/version-authority.js
          node --check service-worker.js
          node --check scripts/v0426-g75e3a-species-ingredient-rate-reference-contract.mjs
          node --check scripts/v0426-release-contract.mjs
      - name: Species ingredient rate reference boundary contract
        run: node scripts/v0426-g75e3a-species-ingredient-rate-reference-contract.mjs
      - name: Preserve v0.4.25 recipe name and subskill numeric contract
        run: node scripts/v0425-recipe-name-subskill-contract.mjs
      - name: Preserve v0.4.24 Nature numeric contract
        run: node scripts/v0424-nature-numeric-modifier-contract.mjs
      - name: Preserve evidence-gated scoring algorithm contract
        run: node scripts/v042-pokemon-scoring-engine-contract.mjs
      - name: v0.4.26 release authority contract
        run: node scripts/v0426-release-contract.mjs
