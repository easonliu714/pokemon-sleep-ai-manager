name: v0.4.27.12 exact hotfix bootstrap

on:
  push:
    branches:
      - fix/v0.4.27.12-confirmation-lifecycle-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.4.27.12-confirmation-lifecycle-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact v0.4.27.12 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8'); actual=s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          # A/B/C/D/F — confirmation semantics, terminal lifecycle, group isolation.
          p='assets/js/analysis-confirmation-workbench.js'
          replace_exact(p,"evolution_other_requirement:'',obtained_at:'',is_favorite:null","evolution_other_requirement:'',registered_at:'',obtained_at:'',is_favorite:null")
          replace_exact(p,"obtained_at:text(identity.registered_date??raw.obtained_at),is_favorite:","registered_at:text(identity.registered_date),obtained_at:text(raw.obtained_at),is_favorite:")
          replace_exact(p,"${field('入手日期','obtained_at',d.obtained_at,'date')}","${field('登錄日期','registered_at',d.registered_at||d.obtained_at,'date')}")
          replace_exact(p,"function render(){","function dispatchConfirmationTerminal(reason,detail={}){try{globalThis.dispatchEvent(new CustomEvent('pokemon-sleep:analysis-confirmation-terminal',{detail:{reason,...detail}}));}catch{}}\n\nfunction render(){")
          replace_exact(p,"root.querySelector('#applyConfirmedAnalysis').onclick=applyConfirmed;root.querySelector('#discardAnalysisDraft').onclick=()=>{currentRevision=null;currentDraft=null;render();};","root.querySelector('#applyConfirmedAnalysis').onclick=applyConfirmed;root.querySelector('#discardAnalysisDraft').onclick=()=>{const analysisId=currentRevision?.analysis_id||null;currentRevision=null;currentDraft=null;render();dispatchConfirmationTerminal('discarded',{analysis_id:analysisId});};")
          replace_exact(p,"status.textContent='已保留本次 Observation，尚未寫入正式寶可夢。';return;","status.textContent='已保留本次 Observation，尚未寫入正式寶可夢。';dispatchConfirmationTerminal('held',{analysis_id:currentRevision.analysis_id||null});return;")
          replace_exact(p,"'evolution_other_requirement','obtained_at']","'evolution_other_requirement','registered_at','obtained_at']")
          replace_exact(p,"merged.original_species=before?.original_species||merged.species;merged.identity_confidence=","merged.original_species=before?.original_species||merged.species;if(!before&&!meaningful(merged.original_label))merged.original_label=merged.species;merged.identity_confidence=")
          replace_exact(p,"globalThis.dispatchEvent(new CustomEvent('pokemon-sleep:analysis-confirmed-applied',{detail:{analysis_id:currentRevision.analysis_id,pokemon_id:pokemonId,mode}}));","globalThis.dispatchEvent(new CustomEvent('pokemon-sleep:analysis-confirmed-applied',{detail:{analysis_id:currentRevision.analysis_id,pokemon_id:pokemonId,mode}}));dispatchConfirmationTerminal('applied',{analysis_id:currentRevision.analysis_id,pokemon_id:pokemonId,mode});")

          p='assets/js/data-consistency-multicapture.js'
          replace_exact(p,"sleep_time_text:'',obtained_at:'',is_favorite:null","sleep_time_text:'',registered_at:'',obtained_at:'',is_favorite:null")
          replace_exact(p,"obtained_at:clean(identity?.registered_date??raw?.obtained_at),","registered_at:clean(identity?.registered_date),\n    obtained_at:clean(raw?.obtained_at),")
          replace_exact(p,"'sleep_time_text','obtained_at','is_favorite'","'sleep_time_text','registered_at','obtained_at','is_favorite'")
          replace_exact(p,"function startNewGroup(){activeGroupId=`capture-${Date.now()}-${Math.random().toString(16).slice(2)}`;group();renderGroupNotice();}","function startNewGroup(reason='manual'){activeGroupId=`capture-${Date.now()}-${Math.random().toString(16).slice(2)}`;group();renderGroupNotice();globalThis.UpdateCenterLiveDebug?.record?.('multicapture_group_started',{group_id:activeGroupId,reason});}\nfunction shouldStartNewGroupForRevision(current,incoming){const currentSpecies=clean(current?.species),incomingSpecies=clean(incoming?.species);return Boolean((current?.source_refs?.length||0)>0&&currentSpecies&&incomingSpecies&&currentSpecies!==incomingSpecies);}")
          old="globalThis.addEventListener('pokemon-sleep:analysis-revision-saved',event=>{\n  const merged=mergeDraft(group().draft,normalizeRevision(event.detail));"
          new="globalThis.addEventListener('pokemon-sleep:analysis-revision-saved',event=>{\n  const incoming=normalizeRevision(event.detail);\n  if(shouldStartNewGroupForRevision(group().draft,incoming))startNewGroup('source_identity_changed');\n  const merged=mergeDraft(group().draft,incoming);"
          replace_exact(p,old,new)
          replace_exact(p,"globalThis.UpdateCenterLiveDebug?.record?.('data_consistency_multicapture_ready'","globalThis.addEventListener('pokemon-sleep:analysis-confirmation-terminal',event=>startNewGroup(event?.detail?.reason||'confirmation_terminal'));\n\nglobalThis.UpdateCenterLiveDebug?.record?.('data_consistency_multicapture_ready'")
          replace_exact(p,"export {VERSION,BUILD,normalizeRevision,mergeDraft};","export {VERSION,BUILD,normalizeRevision,mergeDraft,shouldStartNewGroupForRevision};")

          # B — one coalesced app refresh after successful confirmation apply.
          p='assets/js/app.js'; s=Path(p).read_text(encoding='utf-8')
          marker='// v0.4.27.12 analysis confirmation apply refresh bridge'
          if marker in s: raise SystemExit('app.js: refresh bridge already present')
          s += "\n\n// v0.4.27.12 analysis confirmation apply refresh bridge\nlet analysisConfirmedRefreshPending=false;\nglobalThis.addEventListener('pokemon-sleep:analysis-confirmed-applied',()=>{\n  if(analysisConfirmedRefreshPending)return;\n  analysisConfirmedRefreshPending=true;\n  Promise.resolve().then(()=>refresh()).catch(error=>console.error('analysis-confirmed refresh failed',error)).finally(()=>{analysisConfirmedRefreshPending=false;});\n});\n"
          Path(p).write_text(s,encoding='utf-8')

          # D/E — detail legacy date fallback + public VERIFIED_NOT_REQUIRED projection only.
          p='assets/js/pokemon-detail.js'
          replace_exact(p,"import {PUBLIC_MAIN_SKILL_MASTER} from './public-pokemon-knowledge-master.js';","import {PUBLIC_MAIN_SKILL_MASTER} from './public-pokemon-knowledge-master.js';\nimport {resolveEvolutionAuthority,hydrateEvolutionDraft,DISPLAY_NOT_REQUIRED} from './analysis-confirmation-evolution-authority.js';")
          replace_exact(p,"const evolution=species?safeRows('SELECT * FROM pokemon_evolution_master WHERE from_species=? ORDER BY to_species',[species]):[];\n  return {nature,mainSkill,mainSkillName,evolution};","const evolution=species?safeRows('SELECT * FROM pokemon_evolution_master WHERE from_species=? ORDER BY to_species',[species]):[];\n  const evolutionProjection=species?hydrateEvolutionDraft({species},resolveEvolutionAuthority(species,rows)):null;\n  return {nature,mainSkill,mainSkillName,evolution,evolutionProjection};")
          replace_exact(p,"function renderEvolution(p,routes){","function publicEvolutionDisplay(projection,field,{suffix='',prefix=''}={}){const state=projection?.evolution_authority?.requirement_states?.[field];if(state==='VERIFIED_NOT_REQUIRED')return DISPLAY_NOT_REQUIRED;const raw=projection?.[field];return meaningful(raw)?`${prefix}${raw}${suffix}`:null;}\nfunction renderEvolution(p,routes,projection=null){")
          replace_exact(p,"  if(routes.length){return `<div class=\"notice\"><b>公版進化條件</b>：個體未匯入條件，以下為版本化公版參考，不寫回玩家欄位。</div><div class=\"skill-list\">${routes.map(r=>`<div class=\"skill-item\"><b>${esc(r.from_species)} → ${esc(r.to_species)}</b><span>${esc(evolutionRequirementsText(r))}</span><small>公版 ${esc(r.data_version||'')}</small></div>`).join('')}</div>`;}","  const authority=projection?.evolution_authority||{};const projectedFields=[['等級門檻',publicEvolutionDisplay(projection,'evolution_level_required',{prefix:'Lv'} )],['進化所需一起睡覺的時間',publicEvolutionDisplay(projection,'evolution_sleep_hours_required',{suffix:' 小時'})],['糖果需求',publicEvolutionDisplay(projection,'evolution_candy_required')],['進化道具',publicEvolutionDisplay(projection,'evolution_item_required')],['其他條件',publicEvolutionDisplay(projection,'evolution_other_requirement')]];\n  if(projectedFields.some(([,v])=>meaningful(v))){return `<div class=\"notice\"><b>公版進化條件</b>：以下僅為顯示 Projection，不寫回玩家欄位。</div>${cards(projectedFields)}`;}\n  if(routes.length){return `<div class=\"notice\"><b>公版進化條件</b>：個體未匯入條件，以下為版本化公版參考，不寫回玩家欄位。</div><div class=\"skill-list\">${routes.map(r=>`<div class=\"skill-item\"><b>${esc(r.from_species)} → ${esc(r.to_species)}</b><span>${esc(evolutionRequirementsText(r))}</span><small>公版 ${esc(r.data_version||'')}</small></div>`).join('')}</div>`;}")
          replace_exact(p,"['登錄日期',p.registered_at]","['登錄日期',p.registered_at||p.obtained_at]")
          replace_exact(p,"${renderEvolution(p,knowledge.evolution)}","${renderEvolution(p,knowledge.evolution,knowledge.evolutionProjection)}")
          replace_exact(p,"${input('registered_at','登錄日期',p.registered_at,'date')}","${input('registered_at','登錄日期',p.registered_at||p.obtained_at,'date')}")

          # A — sanitize provider model trace before UI dispatch; no alias/fingerprint/key/project payload.
          p='assets/js/ai-review-executor-controller.js'
          replace_exact(p,"const CONTROLLER_SCHEMA='pokemon-sleep-ai-review-executor-controller/1.0';","const CONTROLLER_SCHEMA='pokemon-sleep-ai-review-executor-controller/1.1-model-status';\nconst MODEL_STATUS_EVENTS=new Set(['ai_model_candidate_started','ai_model_candidate_failed','ai_model_timeout_project_state_released','ai_model_failover','ai_model_fallback_promoted']);\nexport function sanitizeModelStatusTrace(event,details={}){if(!MODEL_STATUS_EVENTS.has(event))return null;const d=details||{};return {event,model:d.model||null,from_model:d.from_model||null,to_model:d.to_model||null,candidate_number:Number(d.candidate_number)||null,candidate_count:Number(d.candidate_count)||null,error_class:d.error_class||null,remaining_ms:Number(d.remaining_ms)||null,candidate_budget_ms:Number(d.candidate_budget_ms)||null,completed_at:d.completed_at||null};}")
          replace_exact(p,"const trace=(event,details)=>target.DebugTrace?.record?.('ai_executor',event,{status:event.endsWith('failed')?'failed':'completed',details});","const trace=(event,details)=>{target.DebugTrace?.record?.('ai_executor',event,{status:event.endsWith('failed')?'failed':'completed',details});const modelStatus=sanitizeModelStatusTrace(event,details);if(modelStatus)target.dispatchEvent?.(new CustomEvent('pokemon-sleep:ai-review-model-status',{detail:modelStatus}));};")

          # A — visible current model/failover + elapsed seconds in normal function UI.
          p='assets/js/ai-review-executor-status-ui.js'
          replace_exact(p,"const STATUS_UI_SCHEMA='pokemon-sleep-ai-review-executor-status-ui/1.1-local-progress';","const STATUS_UI_SCHEMA='pokemon-sleep-ai-review-executor-status-ui/1.2-model-failover-visible';")
          replace_exact(p,"export function createAiReviewExecutorStatusUi({root=document,target=globalThis}={}){\n  let status=null;","function elapsedSeconds(startedAt){return startedAt?Math.max(0,Math.floor((Date.now()-startedAt)/1000)):0;}\nfunction modelStatusText(modelState,status){const d=status?.detail||{},pos=d.current&&d.total?`AI ${d.current}/${d.total}`:'AI',file=d.file_name||'目前圖片',elapsed=elapsedSeconds(modelState.imageStartedAt);if(modelState.transition)return `${modelState.transition}｜累計 ${elapsed} 秒`;return `${pos}｜${modelState.model||d.model||'模型確認中'}｜${file}｜等待 ${elapsed} 秒`;}\n\nexport function createAiReviewExecutorStatusUi({root=document,target=globalThis}={}){\n  let status=null;const modelState={model:null,imageStartedAt:null,transition:null};")
          replace_exact(p,"progress:event=>set('running',`AI 覆核：${event.detail?.current||0}/${event.detail?.total||0}。`,event.detail),","progress:event=>{const d=event.detail||{};if(d.phase==='started'){modelState.model=d.model||modelState.model;modelState.imageStartedAt=Date.now();modelState.transition=null;}if(d.phase==='completed'){modelState.model=d.model||modelState.model;modelState.transition=null;}set('running',modelStatusText(modelState,{detail:d}),d);},")
          replace_exact(p,"  const onCross=event=>{","  const onModelStatus=event=>{const d=event.detail||{};if(d.event==='ai_model_candidate_started'){modelState.model=d.model||modelState.model;modelState.transition=null;}else if(d.event==='ai_model_failover'){modelState.model=d.to_model||modelState.model;modelState.transition=`${d.from_model||'前一模型'} ${d.error_class==='provider_timeout'||d.error_class==='provider_total_timeout'?'逾時':'失敗'}，切換 → ${d.to_model||'下一模型'}`;}else if(d.event==='ai_model_fallback_promoted'){modelState.model=d.to_model||modelState.model;modelState.transition=`${d.to_model||modelState.model||'Fallback 模型'} 完成，已設為下次首選`;}set('running',modelStatusText(modelState,status),{...(status?.detail||{}),model_event:d.event,model:modelState.model});};\n  target.addEventListener?.('pokemon-sleep:ai-review-model-status',onModelStatus);\n  const ticker=setInterval(()=>{if(status?.state==='running'&&modelState.imageStartedAt){status.message=modelStatusText(modelState,status);updatePanel(root,status);}},1000);\n  const onCross=event=>{")
          replace_exact(p,"target.removeEventListener?.('pokemon-sleep:analysis-cross-check-ready',onCross);target.removeEventListener?.('pokemon-sleep:identity-import-files-selected',onSource);}};","target.removeEventListener?.('pokemon-sleep:analysis-cross-check-ready',onCross);target.removeEventListener?.('pokemon-sleep:identity-import-files-selected',onSource);target.removeEventListener?.('pokemon-sleep:ai-review-model-status',onModelStatus);clearInterval(ticker);}};")

          # Release authority: code-only hotfix, no schema migration / Production Authority change.
          p='assets/js/version-authority.js'
          replace_exact(p,"app_version: 'v0.4.27.11',\n    app_build: '20260818-v042711-model-health-fallback-persistence',\n    cache_name: 'pokemon-sleep-ai-v0.4.27.11-v042711-model-health-fallback-persistence',","app_version: 'v0.4.27.12',\n    app_build: '20260819-v042712-confirmation-lifecycle-ux',\n    cache_name: 'pokemon-sleep-ai-v0.4.27.12-v042712-confirmation-lifecycle-ux',")
          replace_exact(p,"// Legacy CI parser bridge only; not executed and not a release authority:\n","// Legacy CI parser bridge only; not executed and not a release authority:\n// app_version: 'v0.4.27.11'\n// app_build: '20260818-v042711-model-health-fallback-persistence'\n// cache_name: 'pokemon-sleep-ai-v0.4.27.11-v042711-model-health-fallback-persistence'\n")

          # Exact behavioral/source contract for the six v0.4.27.12 gates.
          contract=Path('scripts/v042712-confirmation-lifecycle-ux-contract.mjs')
          contract.write_text(r'''import fs from 'node:fs';
import assert from 'node:assert/strict';
const read=p=>fs.readFileSync(p,'utf8');
const workbench=read('assets/js/analysis-confirmation-workbench.js');
const multi=read('assets/js/data-consistency-multicapture.js');
const app=read('assets/js/app.js');
const detail=read('assets/js/pokemon-detail.js');
const controller=read('assets/js/ai-review-executor-controller.js');
const statusUi=read('assets/js/ai-review-executor-status-ui.js');
const version=read('assets/js/version-authority.js');
assert.match(version,/app_version: 'v0\.4\.27\.12'/);
assert.match(workbench,/registered_at:text\(identity\.registered_date\)/);
assert.match(workbench,/obtained_at:text\(raw\.obtained_at\)/);
assert.match(workbench,/if\(!before&&!meaningful\(merged\.original_label\)\)merged\.original_label=merged\.species/);
assert.match(workbench,/analysis-confirmation-terminal/);
assert.match(workbench,/dispatchConfirmationTerminal\('held'/);
assert.match(workbench,/dispatchConfirmationTerminal\('discarded'/);
assert.match(workbench,/dispatchConfirmationTerminal\('applied'/);
assert.match(multi,/shouldStartNewGroupForRevision/);
assert.match(multi,/source_identity_changed/);
assert.match(multi,/analysis-confirmation-terminal/);
assert.match(app,/analysis-confirmed-applied/);
assert.match(app,/analysisConfirmedRefreshPending/);
assert.match(detail,/p\.registered_at\|\|p\.obtained_at/);
assert.match(detail,/DISPLAY_NOT_REQUIRED/);
assert.match(detail,/以下僅為顯示 Projection，不寫回玩家欄位/);
assert.match(controller,/sanitizeModelStatusTrace/);
assert.match(controller,/pokemon-sleep:ai-review-model-status/);
const sanitizerBody=controller.slice(controller.indexOf('export function sanitizeModelStatusTrace'),controller.indexOf("const SESSION_KEY"));
assert.doesNotMatch(sanitizerBody,/\.key\b|fingerprint|project_alias|used_alias/);
assert.match(statusUi,/ai_model_failover/);
assert.match(statusUi,/等待 \$\{elapsed\} 秒/);
assert.match(statusUi,/切換 →/);
assert.doesNotMatch(statusUi,/API Key|project\.key|fingerprint/);
console.log('v0.4.27.12 confirmation lifecycle UX contract: PASS');
''',encoding='utf-8')

          p='.github/workflows/regression-gate.yml'
          replace_exact(p,"          node scripts/v04275-g72-effective-event-energy-authority-contract.mjs\n","          node scripts/v04275-g72-effective-event-energy-authority-contract.mjs\n          node scripts/v042712-confirmation-lifecycle-ux-contract.mjs\n")
          PY
      - name: Static syntax and targeted gate
        run: |
          node --check assets/js/analysis-confirmation-workbench.js
          node --check assets/js/data-consistency-multicapture.js
          node --check assets/js/app.js
          node --check assets/js/pokemon-detail.js
          node --check assets/js/ai-review-executor-controller.js
          node --check assets/js/ai-review-executor-status-ui.js
          node scripts/v042712-confirmation-lifecycle-ux-contract.mjs
      - name: Commit exact patch and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/v042712-bootstrap.yml
          git add assets/js/analysis-confirmation-workbench.js assets/js/data-consistency-multicapture.js assets/js/app.js assets/js/pokemon-detail.js assets/js/ai-review-executor-controller.js assets/js/ai-review-executor-status-ui.js assets/js/version-authority.js scripts/v042712-confirmation-lifecycle-ux-contract.mjs .github/workflows/regression-gate.yml
          git commit -m "fix(v0.4.27.12): isolate confirmation lifecycle and expose model failover"
          git push origin HEAD:fix/v0.4.27.12-confirmation-lifecycle-ux
