name: v0.4.16 G7.3 Production Team Search

on:
  push:
    branches:
      - feature/v0.4.16-g73-production-team-search-contract
  pull_request:
    paths:
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/team-objective-evaluator.js'
      - 'assets/js/bounded-team-search.js'
      - 'assets/js/strategy-optimization-pack.js'
      - 'assets/js/strategy-optimization-ai-contract.js'
      - 'assets/js/strategy-context-local.js'
      - 'assets/js/war-room-strategy-context-ui.js'
      - 'assets/js/v0416-g73-ui.js'
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'scripts/v0416-g73-production-team-search-contract.mjs'
      - '.github/workflows/v0416-g73-production-team-search.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check G7.3 modules
        run: |
          node --check assets/js/production-authority-registry.js
          node --check assets/js/team-objective-evaluator.js
          node --check assets/js/bounded-team-search.js
          node --check assets/js/strategy-optimization-pack.js
          node --check assets/js/strategy-optimization-ai-contract.js
          node --check assets/js/strategy-context-local.js
          node --check assets/js/war-room-strategy-context-ui.js
          node --check assets/js/v0416-g73-ui.js
          node --check service-worker.js
      - name: G7.3 production authority and bounded search contract
        run: node scripts/v0416-g73-production-team-search-contract.mjs
