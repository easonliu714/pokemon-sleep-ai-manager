name: v0.4.13.3 Shared Gemini Transport Diagnostic

on:
  pull_request:
    paths:
      - 'assets/js/ai-project-pool-runtime.js'
      - 'assets/js/uc-img-gemini-adapter.js'
      - 'assets/js/unified-screenshot-update-center.js'
      - 'assets/js/version-authority.js'
      - 'scripts/uc-img-internal-gemini-contract.mjs'
      - 'scripts/v04114-recipe-zh-tw-diagnostic-export-contract.mjs'
      - 'scripts/v04133-shared-gemini-transport-diagnostic-contract.mjs'
      - 'scripts/ci-p6a-ucimg-wrapper-parity-contract.mjs'
      - '.github/workflows/uc-img-a.yml'
      - '.github/workflows/v04133-shared-gemini-transport-diagnostic.yml'
  push:
    branches: ["main"]
    paths:
      - 'assets/js/ai-project-pool-runtime.js'
      - 'assets/js/uc-img-gemini-adapter.js'
      - 'assets/js/unified-screenshot-update-center.js'
      - 'assets/js/version-authority.js'
      - 'scripts/uc-img-internal-gemini-contract.mjs'
      - 'scripts/v04114-recipe-zh-tw-diagnostic-export-contract.mjs'
      - 'scripts/v04133-shared-gemini-transport-diagnostic-contract.mjs'
      - '.github/workflows/v04133-shared-gemini-transport-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared Gemini transport and diagnostic contract
        run: node scripts/v04133-shared-gemini-transport-diagnostic-contract.mjs
      - name: UC.IMG internal Gemini successor contract
        run: node scripts/uc-img-internal-gemini-contract.mjs
      - name: Diagnostic export successor contract
        run: node scripts/v04114-recipe-zh-tw-diagnostic-export-contract.mjs
