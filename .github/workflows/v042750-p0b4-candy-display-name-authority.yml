name: V042750 P0-B4 Candy Display-Name Authority

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-b4-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify P0-B3 predecessor contract
        run: node scripts/v042749-p0b3-candy-family-authority-contract.mjs

      - name: Verify P0-B4 Candy display-name authority contract
        run: node scripts/v042750-p0b4-candy-display-name-authority-contract.mjs
