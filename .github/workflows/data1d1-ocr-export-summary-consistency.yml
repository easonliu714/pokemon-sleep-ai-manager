name: Frontend Regression Gate - DATA.1D.1 OCR Export Summary Consistency

on:
  pull_request:
    paths:
      - 'assets/js/data1-zip-inventory.js'
      - 'assets/js/data1-inventory-review.js'
      - 'assets/js/data1d1-manual-reocr.js'
      - 'assets/js/bootstrap.js'
      - 'service-worker.js'
      - 'scripts/data1d1-ocr-export-summary-consistency-regression.mjs'
      - '.github/workflows/data1d1-ocr-export-summary-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/data1d1-ocr-export-summary-consistency-regression.mjs
