name: v0.4.19 G7.5A Berry Strength Numeric Master

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check berry strength modules
        run: |
          node --check assets/js/public-berry-strength-master.js
          node --check assets/js/production-authority-registry.js
          node --check assets/js/production-evidence-registry.js
          node --check assets/js/production-evidence-ui.js
          node --check assets/js/team-objective-evaluator.js
          node --check service-worker.js
          node --check scripts/v0419-g75a-berry-strength-contract.mjs
          node --check scripts/v0423-predecessor-contract-runner.mjs
      - name: G7.5A berry strength numeric master contract
        run: node scripts/v0423-predecessor-contract-runner.mjs scripts/v0419-g75a-berry-strength-contract.mjs
