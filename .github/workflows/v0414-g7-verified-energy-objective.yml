name: v0.4.14 G7 Verified Energy Objective

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'assets/js/recipe-portfolio-contention.js'
      - 'assets/js/recipe-portfolio-contention-local.js'
      - 'assets/js/war-room-cooking-planner-ui.js'
      - 'assets/js/weekly-event-effect-registry.js'
      - 'assets/js/weekly-context-normalization.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v0414-g7-verified-energy-objective-contract.mjs'
      - '.github/workflows/v0414-g7-verified-energy-objective.yml'
  pull_request:
    paths:
      - 'assets/js/recipe-portfolio-contention.js'
      - 'assets/js/recipe-portfolio-contention-local.js'
      - 'assets/js/war-room-cooking-planner-ui.js'
      - 'assets/js/weekly-event-effect-registry.js'
      - 'assets/js/weekly-context-normalization.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v0414-g7-verified-energy-objective-contract.mjs'
      - '.github/workflows/v0414-g7-verified-energy-objective.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check G7 runtime
        run: |
          node --check assets/js/recipe-portfolio-contention.js
          node --check assets/js/recipe-portfolio-contention-local.js
          node --check assets/js/war-room-cooking-planner-ui.js
      - name: Verified energy objective contract
        run: node scripts/v0414-g7-verified-energy-objective-contract.mjs
