name: v0.4.28 G7.5E3C4A Independent Source Admission

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'assets/js/ingredient-probability-independent-source-admission.js'
      - 'assets/js/ingredient-probability-independent-crosscheck-contract.js'
      - 'assets/js/ingredient-probability-independent-source-readiness.js'
      - 'assets/js/ingredient-probability-activation-policy.js'
      - 'assets/js/public-pokemon-species-form-roster.js'
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v0428-g75e3c4a-independent-source-admission-contract.mjs'
      - 'scripts/v0428-g75e3c4-independent-crosscheck-contract.mjs'
      - 'scripts/v0428-g75e3c2-public-species-form-roster-contract.mjs'
      - 'scripts/v0428-g75e3c-probability-evidence-policy-contract.mjs'
      - 'scripts/v0427-release-contract.mjs'
      - '.github/workflows/v0428-g75e3c4a-independent-source-admission.yml'
  pull_request:
    paths:
      - 'assets/js/ingredient-probability-independent-source-admission.js'
      - 'assets/js/ingredient-probability-independent-crosscheck-contract.js'
      - 'assets/js/ingredient-probability-independent-source-readiness.js'
      - 'assets/js/ingredient-probability-activation-policy.js'
      - 'assets/js/public-pokemon-species-form-roster.js'
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v0428-g75e3c4a-independent-source-admission-contract.mjs'
      - 'scripts/v0428-g75e3c4-independent-crosscheck-contract.mjs'
      - 'scripts/v0428-g75e3c2-public-species-form-roster-contract.mjs'
      - 'scripts/v0428-g75e3c-probability-evidence-policy-contract.mjs'
      - 'scripts/v0427-release-contract.mjs'
      - '.github/workflows/v0428-g75e3c4a-independent-source-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-source-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check independent source admission
        run: |
          node --check assets/js/ingredient-probability-independent-source-admission.js
          node --check scripts/v0428-g75e3c4a-independent-source-admission-contract.mjs
      - name: Verify independent source admission evidence
        run: node scripts/v0428-g75e3c4a-independent-source-admission-contract.mjs
      - name: Preserve independent crosscheck readiness
        run: node scripts/v0428-g75e3c4-independent-crosscheck-contract.mjs
      - name: Preserve probability admission and public roster gates
        run: |
          node scripts/v0428-g75e3c-probability-evidence-policy-contract.mjs
          node scripts/v0428-g75e3c2-public-species-form-roster-contract.mjs
      - name: Preserve v0.4.27 Production release boundary
        run: node scripts/v0427-release-contract.mjs
      - name: Verify governance-only module remains local and read-only
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const file='assets/js/ingredient-probability-independent-source-admission.js';
          const source=fs.readFileSync(file,'utf8');
          for(const forbidden of ['fetch(', 'raw.githubusercontent.com', 'localStorage', 'sessionStorage', 'indexedDB', 'INSERT INTO', 'UPDATE ingredient_inventory', 'DELETE FROM', 'applyPayload(', 'dryRun(']) {
            if(source.includes(forbidden)) throw new Error(`${file} contains forbidden runtime/write path: ${forbidden}`);
          }
          const sw=fs.readFileSync('service-worker.js','utf8');
          if(sw.includes('ingredient-probability-independent-source-admission.js')) throw new Error('admission governance module must not be PWA precached');
          NODE
      - name: Verify repository not mutated
        run: git diff --exit-code
