name: G13.2M OCR and AI A/B Diagnostic
on:
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/g13_2m_ocr_ai_ab_diagnostic_gate.mjs
