name: G13.4 OCR AI Cross Check Confidence
on:
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/g13_4_ocr_ai_cross_check_confidence_gate.mjs
