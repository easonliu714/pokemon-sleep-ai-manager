name: v0.4.18 G7.5 Production Evidence Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'assets/js/production-evidence-registry.js'
      - 'assets/js/production-evidence-ui.js'
      - 'assets/js/strategy-context-local.js'
      - 'assets/js/war-room-strategy-context-ui.js'
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'scripts/v0418-g75-production-evidence-contract.mjs'
      - '.github/workflows/v0418-g75-production-evidence.yml'
  pull_request:
    paths:
      - 'assets/js/production-evidence-registry.js'
      - 'assets/js/production-evidence-ui.js'
      - 'assets/js/strategy-context-local.js'
      - 'assets/js/war-room-strategy-context-ui.js'
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'scripts/v0418-g75-production-evidence-contract.mjs'
      - '.github/workflows/v0418-g75-production-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check production evidence modules
        run: |
          node --check assets/js/production-evidence-registry.js
          node --check assets/js/production-evidence-ui.js
          node --check assets/js/strategy-context-local.js
          node --check assets/js/war-room-strategy-context-ui.js
          node --check service-worker.js
      - name: G7.5 production evidence contract
        run: node scripts/v0418-g75-production-evidence-contract.mjs
