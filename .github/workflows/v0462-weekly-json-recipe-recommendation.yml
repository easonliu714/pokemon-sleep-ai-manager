name: V0.4.6.2 Weekly JSON and Recipe Recommendation

on:
  pull_request:
    paths:
      - 'assets/js/version-authority.js'
      - 'assets/js/prompt-catalog.js'
      - 'assets/js/weekly-context-normalization.js'
      - 'assets/js/weekly-context-import-contract.js'
      - 'assets/js/weekly-context-update-center-bridge.js'
      - 'assets/js/weekly-context-store.js'
      - 'assets/js/ai-workflow.js'
      - 'assets/js/shared-knowledge-ui.js'
      - 'assets/js/current-week-recipe-recommendation-bridge.js'
      - 'assets/js/recipe-strategy-projection.js'
      - 'scripts/v0462-weekly-json-recipe-recommendation-contract.mjs'
      - 'scripts/v0462-release-contract.mjs'
      - 'scripts/v0461-weekly-context-integration-contract.mjs'
      - 'scripts/v0461-release-contract.mjs'
      - 'scripts/war2b-recipe-discovery-stockpile-contract.mjs'
      - '.github/workflows/v0462-weekly-json-recipe-recommendation.yml'
  workflow_dispatch:

jobs:
  weekly-json-recipe-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify v0.4.6.2 weekly JSON and recipe authority behavior
        run: node scripts/v0462-weekly-json-recipe-recommendation-contract.mjs
      - name: Verify WAR.2B discovery remains green
        run: node scripts/war2b-recipe-discovery-stockpile-contract.mjs
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node --check assets/js/prompt-catalog.js
          node --check assets/js/weekly-context-normalization.js
          node --check assets/js/weekly-context-import-contract.js
          node --check assets/js/weekly-context-update-center-bridge.js
          node --check assets/js/ai-workflow.js
          node --check assets/js/shared-knowledge-ui.js
          node --check assets/js/current-week-recipe-recommendation-bridge.js
          node --check scripts/v0462-weekly-json-recipe-recommendation-contract.mjs
      - name: Verify no tracked test mutation
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
