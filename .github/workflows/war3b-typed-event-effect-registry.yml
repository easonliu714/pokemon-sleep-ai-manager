name: WAR.3B Typed Event Effect Registry

on:
  pull_request:
    paths:
      - 'assets/js/version-authority.js'
      - 'assets/js/weekly-event-effect-registry.js'
      - 'assets/js/weekly-context-normalization.js'
      - 'assets/js/weekly-context-import-contract.js'
      - 'assets/js/weekly-context-ui-bridge.js'
      - 'assets/js/prompt-catalog.js'
      - 'assets/js/pokemon-evaluation-contract.js'
      - 'assets/js/pokemon-candidate-feature-projection.js'
      - 'assets/js/recipe-discovery-stockpile.js'
      - 'scripts/war3b-typed-event-effect-registry-contract.mjs'
      - 'scripts/v048-release-contract.mjs'
      - 'scripts/v047-release-contract.mjs'
      - 'scripts/v0463-release-contract.mjs'
      - '.github/workflows/war3b-typed-event-effect-registry.yml'
  workflow_dispatch:

jobs:
  typed-event-effect-registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact v0.4.8 release contract
        run: node scripts/v048-release-contract.mjs
      - name: Verify WAR.3B typed event registry behavior
        run: node scripts/war3b-typed-event-effect-registry-contract.mjs
      - name: Verify historical v0.4.7 Candy behavior remains green
        run: node scripts/v047-release-contract.mjs
      - name: Verify historical v0.4.6.3 Weekly behavior remains green
        run: node scripts/v0463-release-contract.mjs
      - name: Verify v0.4.6.3 type-repair behavior remains green
        run: node scripts/v0463-weekly-ai-type-repair-contract.mjs
      - name: Verify WAR.2B discovery baseline remains green
        run: node scripts/war2b-recipe-discovery-stockpile-contract.mjs
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node --check assets/js/version-authority.js
          node --check assets/js/weekly-event-effect-registry.js
          node --check assets/js/weekly-context-normalization.js
          node --check assets/js/weekly-context-import-contract.js
          node --check assets/js/weekly-context-ui-bridge.js
          node --check assets/js/prompt-catalog.js
          node --check assets/js/pokemon-evaluation-contract.js
          node --check assets/js/pokemon-candidate-feature-projection.js
          node --check assets/js/recipe-discovery-stockpile.js
          node --check scripts/war3b-typed-event-effect-registry-contract.mjs
          node --check scripts/v048-release-contract.mjs
          node --check scripts/v047-release-contract.mjs
          node --check scripts/v0463-release-contract.mjs
      - name: Verify no tracked test mutation
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
