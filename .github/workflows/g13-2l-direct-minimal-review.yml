name: G13.2L Direct Minimal Review Preemption
on:
  pull_request:
    paths:
      - 'assets/js/data1d1-ocr-region-direct-minimal-hotfix.js'
      - 'assets/js/data1d1-ocr-region-single-item-ui.js'
      - 'index.html'
      - 'service-worker.js'
      - 'tests/g13_2l_direct_minimal_review_gate.mjs'
      - '.github/workflows/g13-2l-direct-minimal-review.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/g13_2l_direct_minimal_review_gate.mjs
