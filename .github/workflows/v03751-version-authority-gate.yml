name: v0.3.75.1 Version Authority Gate
on:
  pull_request:
    paths:
      - 'assets/js/bootstrap.js'
      - 'service-worker.js'
      - 'index.html'
      - 'tests/v03751_version_authority_gate.mjs'
      - '.github/workflows/v03751-version-authority-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check assets/js/bootstrap.js
          node --check service-worker.js
      - name: Version authority contract
        run: node tests/v03751_version_authority_gate.mjs
