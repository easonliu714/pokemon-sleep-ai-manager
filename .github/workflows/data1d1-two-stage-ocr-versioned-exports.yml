name: Frontend Regression Gate - DATA.1D.1 Two-Stage OCR Versioned Exports

on:
  pull_request:
    paths:
      - 'assets/js/runtime-version.js'
      - 'assets/js/data1d1-manual-reocr.js'
      - 'assets/js/data1-inventory-review-ui.js'
      - 'assets/js/data1-zip-inventory.js'
      - 'assets/js/data1d1-ocr-review-package.js'
      - 'assets/js/bootstrap.js'
      - 'service-worker.js'
      - 'scripts/data1d1-two-stage-ocr-versioned-exports-regression.mjs'
      - '.github/workflows/data1d1-two-stage-ocr-versioned-exports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/data1d1-two-stage-ocr-versioned-exports-regression.mjs
