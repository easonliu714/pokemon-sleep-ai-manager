name: V0.3.87 Safe Boot Gate

on:
  pull_request:
    paths:
      - 'assets/js/storage.js'
      - 'assets/js/database.js'
      - 'assets/js/bootstrap.js'
      - 'assets/js/v0382-release-authority.js'
      - 'service-worker.js'
      - 'service-worker-v0387.js'
      - 'tests/v0387-safe-boot-contract.test.mjs'
      - '.github/workflows/v0387-safe-boot-gate.yml'
  workflow_dispatch:

jobs:
  safe-boot-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/storage.js
          node --check assets/js/database.js
          node --check assets/js/bootstrap.js
          node --check assets/js/v0382-release-authority.js
          node --check service-worker.js
          node --check service-worker-v0387.js
      - name: Safe boot contract
        run: node tests/v0387-safe-boot-contract.test.mjs
