name: Frontend Regression Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify CI topology policy
        run: node scripts/ci-topology-regression.mjs

      - name: Verify P5 wrapper side-by-side parity topology
        run: python scripts/p5-wrapper-side-by-side-parity-contract.py

      - name: Verify Debug Trace Manager predecessor contract
        run: node scripts/debug-trace-manager-predecessor-contract.mjs

      - name: Install P5 Python contract dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Verify General JSON / Profile Completeness / Update Center predecessor contracts
        run: node scripts/general-json-profile-update-center-predecessor-contract.mjs

      - name: Verify P5 core Update Center / human review successor contract
        run: node scripts/p5-core-update-center-human-review-successor-contract.mjs

      - name: Verify species ingredient candidate boundary
        run: node scripts/public-species-ingredient-candidate-authority-contract.mjs

      - name: Extract pinned species ingredient candidates
        run: node scripts/extract-public-species-ingredient-candidates.mjs

      - name: Verify runtime candidate parity
        run: node scripts/public-species-ingredient-candidate-parity-contract.mjs

      - name: Extract pinned zh-TW species/form identities
        run: node scripts/extract-public-species-form-zh-tw-identities.mjs

      - name: Verify zh-TW species/form identity runtime parity
        run: node scripts/public-species-form-zh-tw-identity-parity-contract.mjs

      - name: Upload species authority audits
        uses: actions/upload-artifact@v4
        with:
          name: species-authority-audits
          path: |
            audits/public-species-ingredient-candidates.json
            audits/public-species-form-zh-tw-identities.json

      - name: Verify visual prompt hallucination policy
        run: node scripts/pokemon-visual-prompt-policy-contract.mjs

      - name: Verify Pokémon visual evidence consistency
        run: node scripts/pokemon-visual-evidence-contract.mjs

      - name: Verify direct observation display vocabulary
        run: node scripts/direct-observation-display-vocabulary-contract.mjs

      - name: Verify fresh 75 Pokémon visual re-audit compiler
        run: node scripts/fresh75-visual-reaudit-compiler-contract.mjs

      - name: Verify E3C-6E first-offline observation runtime closure
        run: node scripts/e3c6e-first-offline-observation-runtime-closure-contract.mjs

      - name: Install regression runtimes
        run: |
          npm install --no-save --no-package-lock sql.js@1.13.0 fake-indexeddb@6.2.4 playwright@1.54.1
          npx playwright install chromium

      - name: Run regression gate
        run: |
          node scripts/regression-gate.mjs
          node scripts/ingredient-inventory-integrity-regression.mjs
          node scripts/v04275-predecessor-release-contract-runner.mjs
          node scripts/v04273-weekly-recipe-semantic-intake-contract.mjs
          node scripts/v04276-public-event-predecessor-contract-runner.mjs
          node scripts/v04275-pe4-effective-weekly-consumer-banner-contract.mjs
          node scripts/v04275-pe6-strategy-event-provenance-contract.mjs
          node scripts/v04275-g72-effective-event-energy-authority-contract.mjs
          node scripts/v042712-confirmation-lifecycle-ux-contract.mjs
          node scripts/v042724-predecessor-v042723-runner.mjs
          node scripts/v042724-e3c6f-censored-series-observation-contract.mjs
          node scripts/v042746-p0b1-professor-candy-observed-delta-contract.mjs
          node scripts/v042747-p0b2-public-pokemon-species-authority-contract.mjs
          node scripts/v042748-ingredient-inferred-zero-integrity-contract.mjs
          node scripts/v042749-p0b3-candy-family-authority-contract.mjs
          node scripts/v042750-p0b4-candy-display-name-authority-contract.mjs

      - name: Verify unlocked Pokémon roster filters
        run: node scripts/pokemon-roster-filter-regression.mjs

      - name: Verify shared and personal data isolation
        run: node scripts/shared-personal-isolation.mjs

      - name: Verify Update Center transactions and restore
        run: node scripts/update-center-regression.mjs

      - name: Verify ingredient gap engine
        run: node scripts/ingredient-gap-regression.mjs

      - name: Verify weekly controlled selects
        run: node scripts/weekly-select-regression.mjs

      - name: Verify preview reset and identity convergence
        run: node scripts/preview-identity-regression.mjs

      - name: Verify personal weekly recipe recommendations
        run: node scripts/personal-weekly-recommendation-regression.mjs

      - name: Verify identity dedup and recipe render guard
        run: node scripts/identity-dedup-recipe-guard-regression.mjs

      - name: Start static web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pokemon-sleep-http.log 2>&1 &
          echo $! > /tmp/pokemon-sleep-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 200 /tmp/pokemon-sleep-http.log || true
          exit 1

      - name: Verify v0.4.27.21 browser player evolution override
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/v042721-browser-contract.mjs

      - name: Verify v0.4.27.22 browser collapsed AI JSON
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/v042722-browser-contract.mjs

      - name: Verify v0.4.27.23 browser player profile consistency
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/v042723-browser-contract.mjs

      - name: Verify v0.4.27.24 browser E3C-6F censored repeated-window observation
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/v042724-browser-contract.mjs

      - name: Verify v0.4.27.48 ingredient inferred-zero Dry-Run / Apply transaction
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/v042748-ingredient-zero-browser-contract.mjs

      - name: Verify v0.4.27.51 P0-B5 candy quantity Dry-Run / Apply transaction
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/v042751-p0b5-candy-quantity-browser-contract.mjs

      - name: Verify browser runtime and dynamic module loading
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/browser-runtime-gate.mjs

      - name: Print static server log on failure
        if: failure()
        run: tail -n 200 /tmp/pokemon-sleep-http.log || true
