name: Frontend Regression Gate - DATA.1D.1 OCR Overlay Browser Lifecycle
on:
  pull_request:
    paths:
      - 'assets/js/data1d1-ocr-thumbnail-region-confidence.js'
      - 'assets/js/data1d1-ocr-thumbnail-overlay-wiring.js'
      - 'assets/js/data1d1-ocr-overlay-lifecycle-events.js'
      - 'scripts/data1d1-ocr-overlay-browser-lifecycle-regression.mjs'
      - '.github/workflows/data1d1-ocr-overlay-browser-lifecycle.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/data1d1-ocr-overlay-browser-lifecycle-regression.mjs
