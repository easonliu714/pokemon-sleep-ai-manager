name: v0.4.27 G7.5E3B Ingredient Slot Distribution

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'assets/js/ingredient-slot-distribution-contract.js'
      - 'assets/js/ingredient-production-evidence-contract.js'
      - 'assets/js/public-species-ingredient-rate-reference.js'
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/production-evidence-registry.js'
      - 'assets/js/team-objective-evaluator.js'
      - 'assets/js/pokemon-candidate-feature-projection.js'
      - 'assets/js/pokemon-scoring-engine.js'
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'scripts/v0426-g75e3a-species-ingredient-rate-reference-contract.mjs'
      - 'scripts/v0426-g75e3a-ingredient-semantic-boundary-contract.mjs'
      - 'scripts/v0427-g75e3b-ingredient-slot-distribution-contract.mjs'
      - 'scripts/v0426-release-contract.mjs'
      - 'scripts/v0427-release-contract.mjs'
      - 'scripts/v0423-production-modifier-contract.mjs'
      - 'scripts/v0424-nature-numeric-modifier-contract.mjs'
      - 'scripts/v0425-recipe-name-subskill-contract.mjs'
      - 'scripts/v04251-recipe-current-authority-lock-contract.mjs'
      - '.github/workflows/v0427-g75e3b-ingredient-slot-distribution.yml'
  pull_request:
    paths:
      - 'assets/js/ingredient-slot-distribution-contract.js'
      - 'assets/js/ingredient-production-evidence-contract.js'
      - 'assets/js/public-species-ingredient-rate-reference.js'
      - 'assets/js/production-authority-registry.js'
      - 'assets/js/production-evidence-registry.js'
      - 'assets/js/team-objective-evaluator.js'
      - 'assets/js/pokemon-candidate-feature-projection.js'
      - 'assets/js/pokemon-scoring-engine.js'
      - 'assets/js/version-authority.js'
      - 'service-worker.js'
      - 'scripts/v0426-g75e3a-species-ingredient-rate-reference-contract.mjs'
      - 'scripts/v0426-g75e3a-ingredient-semantic-boundary-contract.mjs'
      - 'scripts/v0427-g75e3b-ingredient-slot-distribution-contract.mjs'
      - 'scripts/v0426-release-contract.mjs'
      - 'scripts/v0427-release-contract.mjs'
      - 'scripts/v0423-production-modifier-contract.mjs'
      - 'scripts/v0424-nature-numeric-modifier-contract.mjs'
      - 'scripts/v0425-recipe-name-subskill-contract.mjs'
      - 'scripts/v04251-recipe-current-authority-lock-contract.mjs'
      - '.github/workflows/v0427-g75e3b-ingredient-slot-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingredient-slot-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check slot distribution runtime
        run: |
          node --check assets/js/ingredient-slot-distribution-contract.js
          node --check assets/js/ingredient-production-evidence-contract.js
          node --check assets/js/production-authority-registry.js
          node --check assets/js/production-evidence-registry.js
          node --check scripts/v0427-g75e3b-ingredient-slot-distribution-contract.mjs
          node --check scripts/v0427-release-contract.mjs
          node --check service-worker.js
      - name: Verify ingredient slot distribution
        run: node scripts/v0427-g75e3b-ingredient-slot-distribution-contract.mjs
      - name: Verify v0.4.27 release authority
        run: node scripts/v0427-release-contract.mjs
      - name: Preserve species ingredient-rate reference HOLD
        run: node scripts/v0426-g75e3a-species-ingredient-rate-reference-contract.mjs
      - name: Preserve candidate/scoring fail-closed contracts
        run: |
          node scripts/v042-pokemon-candidate-feature-contract.mjs
          node scripts/v042-pokemon-scoring-engine-contract.mjs
      - name: Preserve recipe and modifier contracts
        run: |
          node scripts/v0423-production-modifier-contract.mjs
          node scripts/v0424-nature-numeric-modifier-contract.mjs
          node scripts/v0425-recipe-name-subskill-contract.mjs
          node scripts/v04251-recipe-current-authority-lock-contract.mjs
          node scripts/v0426-release-contract.mjs
      - name: Verify no writes or runtime network in slot contract
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('assets/js/ingredient-slot-distribution-contract.js','utf8');
          for(const forbidden of ['fetch(', 'localStorage', 'sessionStorage', 'indexedDB', 'INSERT INTO', 'UPDATE ', 'DELETE FROM', 'applyPayload(', 'dryRun(']) {
            if(source.includes(forbidden)) throw new Error(`slot distribution contract contains forbidden path: ${forbidden}`);
          }
          NODE
      - name: Verify repository not mutated
        run: git diff --exit-code
