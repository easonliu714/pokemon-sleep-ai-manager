name: V0.3.88 Zero SQL Rescue Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/js/database.js
      - run: node --check assets/js/app.js
      - name: Verify zero SQL rescue contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const source=readFileSync('assets/js/database.js','utf8');
          assert.match(source,/zero_sql:true/);
          assert.match(source,/if\(rescueReadonly\)return \[\]/);
          assert.match(source,/if\(rescueReadonly\)return 0/);
          const start=source.indexOf('async function createReadonlyRescueDatabase');
          const end=source.indexOf('export async function inspectDatabaseBoot',start);
          assert.ok(start>=0&&end>start,'unable to isolate createReadonlyRescueDatabase');
          const rescueFunction=source.slice(start,end);
          assert.doesNotMatch(rescueFunction,/initSqlJs|new SQL\.Database|loadDatabaseBytes/,'rescue function must remain zero-SQL');
          assert.match(rescueFunction,/db=null/);
          assert.match(rescueFunction,/dispatchReadyAsync\(detail\)/);
          console.log('PASS zero-SQL rescue function boundary');
          NODE
