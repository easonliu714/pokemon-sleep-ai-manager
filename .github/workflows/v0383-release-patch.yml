name: v0.3.83 Release Patch

on:
  push:
    branches:
      - feature/v0383-catalog-ocr-review-contract

permissions:
  contents: write

jobs:
  apply-release-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v0383-catalog-ocr-review-contract
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.3.83 release patch
        run: node scripts/apply-v0383-release-patch.mjs
      - name: Validate release contract
        run: |
          node --check assets/js/v0383-catalog-ocr-review-contract.js
          grep -q "const APP_VERSION = 'v0.3.83'" assets/js/bootstrap.js
          grep -q "pokemon-sleep-ai-v0.3.83-v0383-catalog-ocr-review-contract" service-worker.js
          grep -q "v0383-catalog-ocr-review-contract.js" assets/js/bootstrap.js
          grep -q "public_default_unlocked:false" assets/js/v0383-catalog-ocr-review-contract.js
          grep -q "public_default_level:1" assets/js/v0383-catalog-ocr-review-contract.js
          grep -q "duplicate_only_terminal_fast_path" assets/js/v0383-catalog-ocr-review-contract.js
          grep -q "full_review_projection_applied" assets/js/v0383-catalog-ocr-review-contract.js
      - name: Commit generated release changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/bootstrap.js assets/js/admin-auth.js assets/js/v0382-release-authority.js service-worker.js index.html
          git commit -m "release(v0.3.83): activate catalog OCR review contract"
          git push origin HEAD:feature/v0383-catalog-ocr-review-contract
