name: v0.4.13.5 Account Capacity Apply NOT NULL

on:
  push:
    branches:
      - main
      - 'hotfix/**'
    paths:
      - 'assets/js/importer.js'
      - 'assets/js/schema.js'
      - 'assets/js/public-master-recognition.js'
      - 'assets/js/pot-capacity-authority.js'
      - 'assets/js/ai-workflow.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v04135-account-capacity-apply-not-null-contract.mjs'
      - '.github/workflows/v04135-account-capacity-apply-not-null.yml'
  pull_request:
    paths:
      - 'assets/js/importer.js'
      - 'assets/js/schema.js'
      - 'assets/js/public-master-recognition.js'
      - 'assets/js/pot-capacity-authority.js'
      - 'assets/js/ai-workflow.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v04135-account-capacity-apply-not-null-contract.mjs'
      - '.github/workflows/v04135-account-capacity-apply-not-null.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Account capacity apply NOT NULL contract
        run: node scripts/v04135-account-capacity-apply-not-null-contract.mjs
