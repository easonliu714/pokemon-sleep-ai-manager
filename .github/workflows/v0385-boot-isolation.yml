name: v0.3.85 Database Boot Isolation

on:
  push:
    branches:
      - hotfix/v0385-database-boot-isolation
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.3.85 patch
        run: node scripts/apply-v0385-boot-isolation.mjs
      - name: Validate boot isolation contract
        run: |
          node --check assets/js/database.js
          node --check assets/js/v0383-catalog-ocr-review-contract.js
          node --check assets/js/public-catalog-workbench.js
          grep -q "boot_persist_skipped" assets/js/database.js
          grep -q "database_write_performed:false" assets/js/v0383-catalog-ocr-review-contract.js
          grep -q "PokemonSleepPublicRecipeRegistry" assets/js/v0383-catalog-ocr-review-contract.js
          grep -q "canonical-registry-v0385-static" assets/js/public-catalog-workbench.js
          grep -q "const APP_VERSION = 'v0.3.85'" assets/js/bootstrap.js
          grep -q "pokemon-sleep-ai-v0.3.85-v0385-database-boot-isolation" service-worker.js
      - name: Commit generated source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/v0383-catalog-ocr-review-contract.js assets/js/public-catalog-workbench.js assets/js/bootstrap.js assets/js/v0382-release-authority.js service-worker.js index.html
          git commit -m "fix(v0.3.85): isolate database boot from public catalog projection"
          git push origin HEAD:${{ github.ref_name }}
