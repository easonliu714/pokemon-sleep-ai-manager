name: v0.3.85 Database Boot Isolation

on:
  push:
    branches:
      - hotfix/v0385-database-boot-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preserved v0.3.85 boot isolation contract
        run: |
          node --check assets/js/database.js
          node --check assets/js/v0383-catalog-ocr-review-contract.js
          node --check assets/js/public-catalog-workbench.js
          node --check assets/js/version-authority.js
          grep -q "boot_persist_skipped" assets/js/database.js
          grep -q "database_write_performed:false" assets/js/v0383-catalog-ocr-review-contract.js
          grep -q "PokemonSleepPublicRecipeRegistry" assets/js/v0383-catalog-ocr-review-contract.js
          grep -q "canonical-registry-v0385-static" assets/js/public-catalog-workbench.js
          grep -q "item_catalog_state" assets/js/public-catalog-workbench.js
          grep -q "recipe_catalog_state" assets/js/public-catalog-workbench.js
          grep -q "app_version:" assets/js/version-authority.js
          grep -q "cache_name:" assets/js/version-authority.js
          ! grep -q "const APP_VERSION = 'v0.3.85'" assets/js/bootstrap.js
