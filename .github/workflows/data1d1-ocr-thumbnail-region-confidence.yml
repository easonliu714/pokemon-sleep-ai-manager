name: Frontend Regression Gate - DATA.1D.1 OCR Thumbnail Confidence
on:
  pull_request:
    paths:
      - 'assets/js/**'
      - 'service-worker.js'
      - 'scripts/data1d1-ocr-thumbnail-region-confidence-regression.mjs'
      - '.github/workflows/data1d1-ocr-thumbnail-region-confidence.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/js/data1d1-ocr-thumbnail-region-confidence.js
      - run: node scripts/data1d1-ocr-thumbnail-region-confidence-regression.mjs
