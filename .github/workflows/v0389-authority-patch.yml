name: V0.3.89 Authority Patch
on:
  push:
    branches: [hotfix/v0389-rescue-catalog-import-recovery]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0389-rescue-catalog-import-recovery
      - name: Patch release authority
        run: |
          python - <<'PY'
          from pathlib import Path
          build='20260805-v0389-rescue-catalog-import-recovery'
          bootstrap=Path('assets/js/bootstrap.js')
          text=bootstrap.read_text(encoding='utf-8')
          text=text.replace("const APP_VERSION = 'v0.3.88';", "const APP_VERSION = 'v0.3.89';")
          text=text.replace("const VERSION = '20260805-v0388-zero-sql-rescue';", f"const VERSION = '{build}';")
          marker="'v0383-catalog-ocr-review-contract.js'"
          if "'v0389-rescue-catalog-import.js'" not in text:
              text=text.replace(marker, marker+",'v0389-rescue-catalog-import.js'")
          entry="await import(`./public-catalog-workbench.js?v=${VERSION}`);"
          if "v0389-rescue-catalog-import.js?v=${VERSION}" not in text:
              text=text.replace(entry, entry+"\n    await import(`./v0389-rescue-catalog-import.js?v=${VERSION}`);")
          bootstrap.write_text(text,encoding='utf-8')
          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          html=html.replace('20260805-v0388-zero-sql-rescue',build)
          index.write_text(html,encoding='utf-8')
          PY
      - name: Commit generated authority
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/bootstrap.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore(v0.3.89): activate rescue catalog and import authority"
          git push
