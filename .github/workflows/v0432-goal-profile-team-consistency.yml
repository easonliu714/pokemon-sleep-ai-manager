name: V0.4.3.2 Goal Profile Team Consistency

on:
  pull_request:
    paths:
      - 'assets/js/strategy-goal-contract.js'
      - 'assets/js/war-room-goal-profile-ui.js'
      - 'assets/js/team-optimizer-local.js'
      - 'assets/js/war-room-team-optimizer-ui.js'
      - 'assets/js/war-room-team-optimizer-bootstrap.js'
      - 'scripts/v0432-goal-profile-team-consistency-contract.mjs'
      - 'scripts/v043-r25-team-optimizer-contract.mjs'
      - 'assets/js/version-authority.js'
      - '.github/workflows/v0432-goal-profile-team-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goal-profile-team-consistency:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify v0.4.3.2 goal/team consistency
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v0432-goal-profile-team-consistency-contract.mjs | tee /tmp/v0432-consistency.json

      - name: Verify existing deterministic team optimizer contract
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node scripts/v043-r25-team-optimizer-contract.mjs | tee /tmp/v043-r25.json

      - name: Verify changed runtime syntax
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node --check assets/js/strategy-goal-contract.js
          node --check assets/js/war-room-goal-profile-ui.js
          node --check assets/js/team-optimizer-local.js
          node --check assets/js/war-room-team-optimizer-ui.js
          node --check assets/js/war-room-team-optimizer-bootstrap.js

      - name: Verify tests do not mutate tracked repository files
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
