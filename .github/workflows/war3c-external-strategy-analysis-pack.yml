name: WAR.3C External Strategy Analysis Pack

on:
  pull_request:
    paths:
      - 'assets/js/version-authority.js'
      - 'assets/js/external-strategy-analysis-pack.js'
      - 'assets/js/external-strategy-analysis-privacy.js'
      - 'assets/js/external-strategy-analysis-local.js'
      - 'assets/js/war-room-strategy-analysis-pack-ui.js'
      - 'assets/js/recipe-strategy-local.js'
      - 'scripts/v0491-release-contract.mjs'
      - 'scripts/v049-release-contract.mjs'
      - 'scripts/war3c-external-strategy-analysis-pack-contract.mjs'
      - 'scripts/v0485-release-contract.mjs'
      - 'scripts/v0484-release-contract.mjs'
      - 'scripts/v0483-release-contract.mjs'
      - 'scripts/v0481-live-followup-contract.mjs'
      - 'scripts/v048-release-contract.mjs'
      - 'scripts/v047-release-contract.mjs'
      - 'scripts/war3b-typed-event-effect-registry-contract.mjs'
      - 'scripts/war3a-candy-inventory-contract.mjs'
      - '.github/workflows/war3c-external-strategy-analysis-pack.yml'
  workflow_dispatch:

jobs:
  external-strategy-analysis-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact v0.4.9.1 WAR.3 LIVE closure release authority
        run: node scripts/v0491-release-contract.mjs
      - name: Verify v0.4.9 historical provider-neutral baseline
        run: node scripts/v049-release-contract.mjs
      - name: Verify WAR.3C executable privacy and semantic-integrity behavior
        run: node scripts/war3c-external-strategy-analysis-pack-contract.mjs
      - name: Verify v0.4.8.5 Android E3 compact containment remains green
        run: node scripts/v0485-release-contract.mjs
      - name: Verify v0.4.8.4 containment historical behavior
        run: node scripts/v0484-release-contract.mjs
      - name: Verify v0.4.8.3 evolution and containment historical behavior
        run: node scripts/v0483-release-contract.mjs
      - name: Verify v0.4.8.1 Weekly/manual override historical behavior
        run: node scripts/v0481-live-followup-contract.mjs
      - name: Verify v0.4.8 typed event release baseline remains green
        run: node scripts/v048-release-contract.mjs
      - name: Verify v0.4.7 Candy release baseline remains green
        run: node scripts/v047-release-contract.mjs
      - name: Verify WAR.3B typed event behavior remains green
        run: node scripts/war3b-typed-event-effect-registry-contract.mjs
      - name: Verify WAR.3A Candy behavior remains green
        run: node scripts/war3a-candy-inventory-contract.mjs
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          node --check assets/js/version-authority.js
          node --check assets/js/external-strategy-analysis-pack.js
          node --check assets/js/external-strategy-analysis-privacy.js
          node --check assets/js/external-strategy-analysis-local.js
          node --check assets/js/war-room-strategy-analysis-pack-ui.js
          node --check assets/js/recipe-strategy-local.js
          node --check scripts/v0491-release-contract.mjs
          node --check scripts/v049-release-contract.mjs
          node --check scripts/war3c-external-strategy-analysis-pack-contract.mjs
          node --check scripts/v0485-release-contract.mjs
      - name: Verify no tracked test mutation
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"
