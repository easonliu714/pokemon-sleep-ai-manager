name: V0.4.8.5 Compact Camp Table Density

on:
  pull_request:
    paths:
      - 'assets/js/version-authority.js'
      - 'assets/js/camp-berry-knowledge-ui.js'
      - 'scripts/v0485-release-contract.mjs'
      - 'scripts/v0484-release-contract.mjs'
      - 'scripts/v0483-release-contract.mjs'
      - 'scripts/v0481-live-followup-contract.mjs'
      - '.github/workflows/v0485-compact-camp-table.yml'
  workflow_dispatch:

jobs:
  compact-camp-table:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact v0.4.8.5 release authority and compact table
        run: node scripts/v0485-release-contract.mjs
      - name: Verify historical v0.4.8.4 containment contract
        run: node scripts/v0484-release-contract.mjs
      - name: Verify historical v0.4.8.3 evidence and containment contract
        run: node scripts/v0483-release-contract.mjs
      - name: Verify historical v0.4.8.1 LIVE behavior
        run: node scripts/v0481-live-followup-contract.mjs
      - name: Verify JavaScript syntax
        run: |
          node --check assets/js/version-authority.js
          node --check assets/js/camp-berry-knowledge-ui.js
          node --check scripts/v0485-release-contract.mjs
          node --check scripts/v0484-release-contract.mjs
          node --check scripts/v0483-release-contract.mjs
          node --check scripts/v0481-live-followup-contract.mjs
      - name: Verify no tracked test mutation
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=no)"