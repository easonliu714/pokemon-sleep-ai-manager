name: v0.4.17 G7.4 AI Proposal Intake

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'assets/js/strategy-optimization-ai-contract.js'
      - 'assets/js/strategy-context-local.js'
      - 'assets/js/war-room-strategy-context-ui.js'
      - 'assets/js/v0416-g73-ui.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v0417-g74-ai-proposal-intake-contract.mjs'
      - 'scripts/v0423-predecessor-contract-runner.mjs'
      - '.github/workflows/v0417-g74-ai-proposal-intake.yml'
  pull_request:
    paths:
      - 'assets/js/strategy-optimization-ai-contract.js'
      - 'assets/js/strategy-context-local.js'
      - 'assets/js/war-room-strategy-context-ui.js'
      - 'assets/js/v0416-g73-ui.js'
      - 'assets/js/version-authority.js'
      - 'scripts/v0417-g74-ai-proposal-intake-contract.mjs'
      - 'scripts/v0423-predecessor-contract-runner.mjs'
      - '.github/workflows/v0417-g74-ai-proposal-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check strategy intake runtime
        run: |
          node --check assets/js/strategy-optimization-ai-contract.js
          node --check assets/js/strategy-context-local.js
          node --check assets/js/war-room-strategy-context-ui.js
          node --check assets/js/v0416-g73-ui.js
          node --check scripts/v0423-predecessor-contract-runner.mjs
      - name: AI proposal intake contract
        run: node scripts/v0423-predecessor-contract-runner.mjs scripts/v0417-g74-ai-proposal-intake-contract.mjs
