# P5 side-by-side parity sentinel; retain this wrapper unchanged until the retirement PR.
name: V0.3.97 Profile Completeness

on:
  pull_request:
    paths:
      - 'assets/js/profile-completeness.js'
      - 'assets/js/full75-recovery-workbench.js'
      - 'assets/js/importer.js'
      - 'assets/js/version-authority.js'
      - 'tests/test_v0397_profile_completeness_contract.py'
      - '.github/workflows/v0397-profile-completeness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Profile completeness contract
        run: python -m pytest -q tests/test_v0397_profile_completeness_contract.py
      - name: JavaScript syntax
        run: |
          node --check assets/js/profile-completeness.js
          node --check assets/js/full75-recovery-workbench.js
          node --check assets/js/version-authority.js
      - name: Privacy boundary
        run: |
          ! grep -R "PRIVATE_CLEAN_BOOTSTRAP_75" assets tests .github/workflows/v0397-profile-completeness.yml
          ! grep -R "pkm_mew\|pkm_darkrai" assets/js/profile-completeness.js
