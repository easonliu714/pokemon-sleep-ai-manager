name: V0427553312 Predecessor Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  predecessor-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Duration authority predecessor
        run: node scripts/ci-g121-sleep-duration-authority-regression.mjs

      - name: Business outcome telemetry predecessor
        if: always()
        run: node tests/v0427553310_business_outcome_telemetry_regression_gate.mjs

      - name: Mobile navigation predecessor
        if: always()
        run: node tests/v0427553310_update_center_mobile_navigation_regression_gate.mjs
