permissions:
  contents: read

concurrency:
  group: uc-img-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uc-img-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared Update Package root contract
        run: node scripts/uc-img-root-contract.mjs
      - name: Verify v0.4.13.1 cross-path data preservation
        run: node scripts/v04131-data-preservation-contract.mjs
      - name: Verify v0.4.13.2 pot authority and Recipe 78 behavior
        run: node scripts/v04132-pot-authority-recipe78-contract.mjs
      - name: Verify v0.4.13.3 shared Gemini transport diagnostic
        run: node scripts/v04133-shared-gemini-transport-diagnostic-contract.mjs
      - name: Verify v0.4.13.4 recipe pot scenario contract
        run: node scripts/v04134-recipe-pot-scenario-contract.mjs
      - name: Verify v0.4.13.5 account capacity apply NOT NULL
        run: node scripts/v04135-account-capacity-apply-not-null-contract.mjs
      - name: Verify v0.4.13.6 pot manual authority alignment
        run: node scripts/v04136-pot-manual-authority-alignment-contract.mjs
      - name: Verify UC.IMG-A executable contract
        run: node scripts/uc-img-a-contract.mjs
      - name: Verify Internal Gemini dual-mode contract
        run: node scripts/uc-img-internal-gemini-contract.mjs
      - name: Verify ingredient key hotfix contract
        run: node scripts/uc-img-ingredient-key-contract.mjs
      - name: Verify Public Master constrained recognition
        run: node scripts/public-master-recognition-contract.mjs
      - name: Verify v0.4.11.1 session cleanup and platform timestamp
        run: node scripts/v04111-uc-img-session-timestamp-contract.mjs
      - name: Verify v0.4.11.2 Android eager image byte snapshot
        run: node scripts/v04112-android-eager-image-bytes-contract.mjs
      - name: Verify v0.4.11.3 Weekly/Recipe semantic safety
        run: node scripts/v04113-weekly-recipe-semantic-safety-contract.mjs
      - name: Verify v0.4.11.4 Recipe zh-TW authority and diagnostic export
        run: node scripts/v04114-recipe-zh-tw-diagnostic-export-contract.mjs
      - name: Verify v0.4.12 Recipe Unified Player Workbench behavior
        run: node scripts/v0412-recipe-unified-player-workbench-contract.mjs
      - name: Verify P6A wrapper retirement proof
        run: node scripts/ci-p6a-ucimg-wrapper-parity-contract.mjs
      - name: Verify current and historical release contracts
        run: |
          CURRENT_VERSION="$(sed -n "s/^[[:space:]]*app_version: '\([^']*\)',/\1/p" assets/js/version-authority.js | head -n1)"
          if [ "$CURRENT_VERSION" = "v0.4.13.2" ]; then node scripts/v04132-release-contract.mjs; fi
          if [ "$CURRENT_VERSION" = "v0.4.13.1" ]; then node scripts/v04131-release-contract.mjs; fi
          if [ "$CURRENT_VERSION" = "v0.4.12" ]; then node scripts/v0412-release-contract.mjs; fi
          if [ "$CURRENT_VERSION" = "v0.4.11.4" ]; then node scripts/v04114-release-contract.mjs; fi
          if [ "$CURRENT_VERSION" = "v0.4.11.3" ]; then node scripts/v04113-release-contract.mjs; fi
          node scripts/v04112-release-contract.mjs
          node scripts/v04111-release-contract.mjs
          node scripts/v0411-release-contract.mjs
          node scripts/v04103-release-contract.mjs
          node scripts/v04102-release-contract.mjs
          node scripts/v04101-release-contract.mjs
          node scripts/v0410-release-contract.mjs
          node scripts/v0491-release-contract.mjs
          node scripts/war3c-external-strategy-analysis-pack-contract.mjs
          node scripts/v0485-release-contract.mjs
      - name: Verify JavaScript syntax
        run: |
          node --check assets/js/data-preservation-policy.js
          node --check assets/js/weekly-context-ui-bridge.js
          node --check assets/js/weekly-context-override-rebase.js
          node --check assets/js/weekly-context-manual-override.js
          node --check assets/js/weekly-context-store.js
          node --check assets/js/pot-capacity-authority.js
          node --check assets/js/importer.js
          node --check assets/js/schema.js
          node --check assets/js/identity-import-apply-operation.js
          node --check assets/js/update-package-contract.js
          node --check assets/js/ai-workflow.js
          node --check assets/js/prompt-catalog.js
          node --check assets/js/unified-screenshot-update-center.js
          node --check assets/js/uc-img-v04132-pot-capacity-bootstrap.js
          node --check assets/js/uc-img-gemini-adapter.js
          node --check assets/js/uc-img-diagnostic-export.js
          node --check assets/js/uc-img-session-lifecycle.js
          node --check assets/js/uc-img-image-runtime.js
          node --check assets/js/uc-img-weekly-platform-authority.js
          node --check assets/js/public-master-recognition.js
          node --check assets/js/public-recipe-alias-master.js
          node --check assets/js/public-recipe-canonical-authority.js
          node --check assets/js/public-recipe-provenance.js
          node --check assets/js/public-recipe-discovery-master.js
          node --check assets/js/recipe-discovery-stockpile.js
          node --check assets/js/recipe-unified-player-workbench.js
          node --check assets/js/public-catalog-workbench.js
          node --check assets/js/shared-master-data.js
          node --check assets/js/ai-project-pool-runtime.js
          node --check assets/js/candy-inventory-ui.js
          node --check assets/js/version-authority.js
          node --check scripts/v04132-pot-authority-recipe78-contract.mjs
          node --check scripts/v04132-release-contract.mjs
          node --check scripts/v04131-data-preservation-contract.mjs
          node --check scripts/v04131-release-contract.mjs
          node --check scripts/v04133-shared-gemini-transport-diagnostic-contract.mjs
          node --check scripts/v04134-recipe-pot-scenario-contract.mjs
          node --check scripts/v04135-account-capacity-apply-not-null-contract.mjs
          node --check scripts/v04136-pot-manual-authority-alignment-contract.mjs
          node --check scripts/ci-p6a-ucimg-wrapper-parity-contract.mjs
          node --check scripts/public-master-recognition-contract.mjs
          node --check scripts/v04111-uc-img-session-timestamp-contract.mjs
          node --check scripts/v04112-android-eager-image-bytes-contract.mjs
          node --check scripts/v04113-weekly-recipe-semantic-safety-contract.mjs
          node --check scripts/v04114-recipe-zh-tw-diagnostic-export-contract.mjs
          node --check scripts/v0412-recipe-unified-player-workbench-contract.mjs
          node --check scripts/v0412-release-contract.mjs
          node --check scripts/v04114-release-contract.mjs
          node --check scripts/v04113-release-contract.mjs
          node --check scripts/v04112-release-contract.mjs
          node --check scripts/v04111-release-contract.mjs
          node --check scripts/uc-img-ingredient-key-contract.mjs
          node --check scripts/v0411-release-contract.mjs
          node --check scripts/v04103-release-contract.mjs
          node --check scripts/uc-img-internal-gemini-contract.mjs
          node --check scripts/v04102-release-contract.mjs
          node --check scripts/v04101-release-contract.mjs