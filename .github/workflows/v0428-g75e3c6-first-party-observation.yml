name: v0.4.28 G7.5E3C6 First-Party Ingredient Observation

on:
  pull_request:
    paths:
      - 'assets/js/ingredient-probability-first-party-observation-contract.js'
      - 'assets/js/ingredient-probability-independent-source-lineage-review.js'
      - 'assets/js/ingredient-slot-distribution-contract.js'
      - 'scripts/v0428-g75e3c6-first-party-observation-contract.mjs'
      - '.github/workflows/v0428-g75e3c6-first-party-observation.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/ingredient-probability-first-party-observation-contract.js'
      - 'scripts/v0428-g75e3c6-first-party-observation-contract.mjs'
      - '.github/workflows/v0428-g75e3c6-first-party-observation.yml'
  workflow_dispatch:

jobs:
  first-party-observation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check first-party observation contract
        run: |
          node --check assets/js/ingredient-probability-first-party-observation-contract.js
          node --check scripts/v0428-g75e3c6-first-party-observation-contract.mjs
      - name: Verify E3C-6 first-party observation contract
        run: node scripts/v0428-g75e3c6-first-party-observation-contract.mjs
      - name: Preserve E3C-5 source lineage review
        run: node scripts/v0428-g75e3c5-source-lineage-review-contract.mjs
      - name: Preserve E3C-4B snapshot intake
        run: node scripts/v0428-g75e3c4b-independent-snapshot-intake-gate.mjs
      - name: Verify observation contract remains runtime-network-free
        shell: bash
        run: |
          ! grep -R --line-number -E 'fetch\(|XMLHttpRequest|localStorage|sessionStorage|indexedDB' \
            assets/js/ingredient-probability-first-party-observation-contract.js
